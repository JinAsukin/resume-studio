<style>
/**

:root {
  --rs-ui-bg: #F4F5F6;
  --rs-ui-card: #FFFFFF;
  --rs-ui-line: #E2E4E8;
  --rs-ui-line-strong: #CFD3D9;
  --rs-ui-text: #1F2937;
  --rs-ui-muted: #6B7280;

  --rs-ui-warn: #B54708;
  --rs-ui-ok: #067647;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--rs-ui-bg);
  color: var(--rs-ui-text);
  font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif;
  font-size: 13px;
  line-height: 1.5;
}

/* ---------- 顶栏 ---------- */
.rs-topbar {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 52px;
  padding: 0 14px;
  background: var(--rs-ui-card);
  border-bottom: 1px solid var(--rs-ui-line);
  position: relative;
  z-index: 30;
}

.rs-brand { font-size: 15px; font-weight: 700; color: var(--rs-ui-accent); letter-spacing: 1px; }
.rs-brand-sub { font-size: 11px; color: var(--rs-ui-faint); font-weight: 400; letter-spacing: 0; margin-left: 4px; }
.rs-spacer { flex: 1 1 auto; }

.rs-saved { font-size: 12px; color: var(--rs-ui-faint); white-space: nowrap; }
.rs-danger-text { color: var(--rs-ui-danger) !important; }

.rs-tb-group { display: flex; align-items: center; gap: 6px; }

/* ---------- 按钮 ---------- */
.rs-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 30px;
  padding: 0 12px;
  font-size: 12.5px;
  color: var(--rs-ui-text);
  background: var(--rs-ui-card);
  border: 1px solid var(--rs-ui-line-strong);
  border-radius: 6px;
  cursor: pointer;
  white-space: nowrap;
  font-family: inherit;
}
.rs-btn:hover { background: #FAFBFC; border-color: var(--rs-ui-accent); color: var(--rs-ui-accent); }
.rs-btn-sm { height: 26px; padding: 0 10px; font-size: 12px; }
.rs-btn-primary { background: var(--rs-ui-accent); border-color: var(--rs-ui-accent); color: #fff; }
.rs-btn-primary:hover { background: #16304F; color: #fff; }

.rs-icon {
  width: 24px;
  height: 24px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  line-height: 1;
  color: var(--rs-ui-muted);
  background: transparent;
  border: 1px solid transparent;
  border-radius: 5px;
  cursor: pointer;
  font-family: inherit;
}
.rs-icon:hover { background: var(--rs-ui-accent-weak); color: var(--rs-ui-accent); }
.rs-icon.rs-danger:hover { background: #FEF3F2; color: var(--rs-ui-danger); }
.rs-icon:disabled { opacity: .35; cursor: not-allowed; }

/* ---------- 下拉菜单 ---------- */
.rs-dd { position: relative; }

.rs-menu {
  position: absolute;
  top: 36px;
  right: 0;
  min-width: 210px;
  background: var(--rs-ui-card);
  border: 1px solid var(--rs-ui-line-strong);
  border-radius: 8px;
  padding: 5px;
  z-index: 40;
  box-shadow: 0 4px 14px rgba(16, 24, 40, .10);
}
.rs-menu button {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  padding: 7px 10px;
  font-size: 12.5px;
  text-align: left;
  color: var(--rs-ui-text);
  background: transparent;
  border: 0;
  border-radius: 5px;
  cursor: pointer;
  font-family: inherit;
}
.rs-menu button:hover { background: var(--rs-ui-accent-weak); color: var(--rs-ui-accent); }
.rs-menu button.is-active { color: var(--rs-ui-accent); font-weight: 600; }
.rs-menu-note { font-size: 11px; color: var(--rs-ui-faint); font-weight: 400; }
.rs-menu-sep { height: 1px; background: var(--rs-ui-line); margin: 5px 6px; }

/* ---------- 主体两栏 ---------- */
.rs-shell { height: 100%; display: flex; flex-direction: column; }

.rs-main {
  flex: 1 1 auto;
  display: grid;
  grid-template-columns: 430px minmax(0, 1fr);
  min-height: 0;
}

.rs-side {
  overflow-y: auto;
  background: var(--rs-ui-bg);
  border-right: 1px solid var(--rs-ui-line);
  padding: 12px;
}

.rs-form { display: flex; flex-direction: column; gap: 10px; }

.rs-preview {
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: #E8E9EB;
}

.rs-stage {
  flex: 1 1 auto;
  overflow: auto;
  position: relative;
  padding: 16px;
}

.rs-frame { position: relative; width: 100%; }

.rs-scaler {
  position: absolute;
  top: 0;
  left: 0;
  transform-origin: top left;
}

.rs-scaler .doc-page {
  box-shadow: 0 1px 5px rgba(16, 24, 40, .14);
}

.rs-statusbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 7px 14px;
  background: var(--rs-ui-card);
  border-top: 1px solid var(--rs-ui-line);
  font-size: 12px;
  color: var(--rs-ui-muted);
  flex: 0 0 auto;
}

.rs-warnbox { display: inline-flex; align-items: center; gap: 6px; }
.rs-warnbox::before {
  content: '';
  width: 7px; height: 7px; border-radius: 50%;
  background: currentColor; flex: 0 0 auto;
}
.rs-warnbox.rs-ok { color: var(--rs-ui-ok); }
.rs-warnbox.rs-warn { color: var(--rs-ui-warn); }
.rs-warnbox.rs-bad { color: var(--rs-ui-danger); font-weight: 600; }

/* ---------- 卡片 ---------- */
.rs-card {
  background: var(--rs-ui-card);
  border: 1px solid var(--rs-ui-line);
  border-radius: 9px;
  overflow: hidden;
}
.rs-card.is-collapsed .rs-card-body { display: none; }
.rs-card.is-collapsed .rs-collapse { transform: rotate(-90deg); }

.rs-card-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 10px;
  background: #FBFCFD;
  border-bottom: 1px solid var(--rs-ui-line);
}
.rs-card.is-collapsed .rs-card-head { border-bottom-color: transparent; }

.rs-collapse {
  width: 20px; height: 20px;
  border: 0; background: transparent;
  color: var(--rs-ui-muted);
  font-size: 12px; cursor: pointer; border-radius: 4px;
  flex: 0 0 auto; transition: transform .15s ease;
  font-family: inherit;
}
.rs-collapse:hover { background: var(--rs-ui-accent-weak); color: var(--rs-ui-accent); }

.rs-card-title { font-size: 13px; font-weight: 700; color: var(--rs-ui-accent); white-space: nowrap; }
.rs-card-hint { font-size: 11.5px; color: var(--rs-ui-faint); white-space: nowrap; }

.rs-card-body { padding: 11px 10px 13px; display: flex; flex-direction: column; gap: 9px; }

.rs-block-title {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 12.5px; font-weight: 700; color: var(--rs-ui-muted);
  padding: 6px 2px 0;
}
.rs-count { font-weight: 400; color: var(--rs-ui-faint); font-size: 11.5px; }

/* ---------- 字段 ---------- */
.rs-field { display: flex; flex-direction: column; gap: 4px; }
.rs-label { font-size: 11.5px; color: var(--rs-ui-muted); }

.rs-input, .rs-area, .rs-select {
  width: 100%;
  font-family: inherit;
  font-size: 12.5px;
  color: var(--rs-ui-text);
  background: #fff;
  border: 1px solid var(--rs-ui-line-strong);
  border-radius: 6px;
  padding: 6px 9px;
}
.rs-input:focus, .rs-area:focus, .rs-select:focus {
  outline: none;
  border-color: var(--rs-ui-accent);
  box-shadow: 0 0 0 2px var(--rs-ui-accent-weak);
}
.rs-area { resize: vertical; line-height: 1.5; min-height: 56px; }
.rs-select { height: 30px; padding: 0 6px; cursor: pointer; }
.rs-select-sm { width: auto; height: 24px; font-size: 11.5px; padding: 0 4px; }

.rs-row { display: flex; align-items: center; gap: 6px; }
.rs-row .rs-input { flex: 1 1 auto; min-width: 0; }
.rs-w-90 { flex: 0 0 90px !important; }
.rs-w-140 { flex: 0 0 140px !important; }

.rs-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }

.rs-subhead {
  font-size: 11.5px; font-weight: 700; color: var(--rs-ui-muted);
  margin-top: 2px; padding-bottom: 3px; border-bottom: 1px dashed var(--rs-ui-line);
}

.rs-switch { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--rs-ui-muted); white-space: nowrap; cursor: pointer; }
.rs-switch input { accent-color: var(--rs-ui-accent); }

.rs-sec-title {
  width: 120px; flex: 0 0 auto;
  font-size: 12.5px; font-weight: 700; color: var(--rs-ui-accent);
  border-color: transparent; background: transparent; padding: 3px 5px;
}
.rs-sec-title:hover { border-color: var(--rs-ui-line-strong); background: #fff; }
.rs-sec-title:focus { border-color: var(--rs-ui-accent); background: #fff; }

/* ---------- 条目块 ---------- */
.rs-item {
  border: 1px solid var(--rs-ui-line);
  border-radius: 7px;
  padding: 9px;
  background: #FCFCFD;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.rs-item-bar { display: flex; align-items: center; gap: 4px; }
.rs-item-no {
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--rs-ui-accent-weak); color: var(--rs-ui-accent);
  font-size: 11px; display: inline-flex; align-items: center; justify-content: center;
}

/* ---------- 照片 ---------- */
.rs-row-photo { align-items: flex-start; }
.rs-photo-box {
  width: 78px; height: 104px; flex: 0 0 auto;
  border: 1px dashed var(--rs-ui-line-strong);
  border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  color: var(--rs-ui-faint); font-size: 11px;
  background: #fff; overflow: hidden;
  cursor: pointer;
  text-align: center;
  line-height: 1.35;
  padding: 0 5px;
  transition: border-color .12s ease, background .12s ease, color .12s ease;
}
.rs-photo-box:hover { border-color: var(--rs-ui-accent); color: var(--rs-ui-accent); }
.rs-photo-box.has-photo { border-style: solid; border-color: var(--rs-ui-line); }
.rs-photo-box.is-drop {
  border-color: var(--rs-ui-accent);
  border-style: dashed;
  background: var(--rs-ui-accent-weak);
  color: var(--rs-ui-accent);
}
.rs-photo-box img { width: 100%; height: 100%; object-fit: cover; }
.rs-photo-actions { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.rs-hint { font-size: 11px; color: var(--rs-ui-faint); }
.rs-hint-warn { color: var(--rs-ui-warn); }

.rs-addsec {
  display: flex; gap: 8px; align-items: center;
  padding: 10px;
  border: 1px dashed var(--rs-ui-line-strong);
  border-radius: 9px;
  background: #FBFCFD;
}
.rs-addsec .rs-select { flex: 1 1 auto; }

/* ---------- 弹窗 ---------- */
.rs-modal {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(16, 24, 40, .38);
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
}
.rs-modal[hidden] { display: none; }

.rs-modal-box {
  width: 100%; max-width: 560px; max-height: 84vh;
  background: var(--rs-ui-card);
  border-radius: 10px;
  display: flex; flex-direction: column;
  overflow: hidden;
  box-shadow: 0 10px 34px rgba(16, 24, 40, .22);
}
.rs-modal-box > header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px; border-bottom: 1px solid var(--rs-ui-line);
  font-size: 13.5px; font-weight: 700; color: var(--rs-ui-accent);
}
.rs-modal-body { padding: 14px; overflow-y: auto; }
.rs-modal-tip { font-size: 12px; color: var(--rs-ui-muted); margin: 0 0 12px; }
.rs-modal-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.rs-modal-actions .rs-btn { flex: 0 0 auto; }

.rs-vrow { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.rs-vrow .rs-input { flex: 1 1 auto; }
.rs-vrow.is-current .rs-input { border-color: var(--rs-ui-accent); font-weight: 700; }
.rs-badge {
  font-size: 11px; color: var(--rs-ui-accent);
  background: var(--rs-ui-accent-weak);
  padding: 2px 7px; border-radius: 20px; white-space: nowrap;
}
.rs-ovlist { margin: 0 0 12px 22px; padding: 0; }
.rs-ovlist li { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
.rs-ovlist code {
  font-size: 11.5px; background: #F2F4F7; padding: 1px 6px; border-radius: 4px;
  color: var(--rs-ui-muted); font-family: Consolas, Monaco, monospace;
}

.rs-tfield { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.rs-tfield > label { flex: 0 0 76px; font-size: 12.5px; color: var(--rs-ui-muted); }
.rs-tfield input[type="color"] { width: 44px; height: 28px; padding: 0; border: 1px solid var(--rs-ui-line-strong); border-radius: 5px; background: #fff; cursor: pointer; }
.rs-tfield input[type="range"] { flex: 1 1 auto; accent-color: var(--rs-ui-accent); }
.rs-tfield .rs-select { flex: 1 1 auto; }

.rs-issuelist { list-style: none; margin: 0; padding: 0; }
.rs-issue { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border-radius: 6px; margin-bottom: 6px; font-size: 12.5px; }
.rs-issue-code { font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 4px; background: rgba(255,255,255,.6); flex: 0 0 auto; }
.rs-issue-red { background: #FEF3F2; color: var(--rs-ui-danger); }
.rs-issue-yellow { background: #FFFAEB; color: var(--rs-ui-warn); }
.rs-issue-gray { background: #F2F4F7; color: var(--rs-ui-muted); }

.rs-tiplist { margin: 0; padding-left: 18px; font-size: 12.5px; line-height: 1.9; color: var(--rs-ui-text); }

/* ---------- 旧简历导入 ---------- */
.rs-drop {
  border: 1.5px dashed var(--rs-ui-line-strong);
  border-radius: 9px;
  padding: 20px 14px;
  text-align: center;
  background: #FBFCFD;
  cursor: pointer;
  transition: border-color .12s ease, background .12s ease;
}
.rs-drop:hover { border-color: var(--rs-ui-accent); background: var(--rs-ui-accent-weak); }
.rs-drop.is-over { border-color: var(--rs-ui-accent); background: var(--rs-ui-accent-weak); }
.rs-drop-main { font-size: 13px; font-weight: 700; color: var(--rs-ui-accent); margin-bottom: 6px; }
.rs-drop-sub { font-size: 12px; color: var(--rs-ui-muted); }

.rs-parsestatus {
  margin-top: 12px;
  padding: 9px 11px;
  border-radius: 6px;
  background: #F2F4F7;
  color: var(--rs-ui-muted);
  font-size: 12.5px;
}
.rs-parsestatus.is-err { background: #FEF3F2; color: var(--rs-ui-danger); }

.rs-result { margin-top: 14px; border-top: 1px solid var(--rs-ui-line); padding-top: 12px; }

.rs-kvline {
  display: flex;
  gap: 10px;
  font-size: 12.5px;
  padding: 3px 0;
}
.rs-kvline > span { flex: 0 0 62px; color: var(--rs-ui-muted); }
.rs-kvline > b { font-weight: 500; color: var(--rs-ui-text); min-width: 0; overflow-wrap: anywhere; }

.rs-seclist { list-style: none; margin: 0 0 12px; padding: 0; }
.rs-seclist li {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 8px;
  border-radius: 5px;
  font-size: 12.5px;
}
.rs-seclist li:nth-child(odd) { background: #FAFBFC; }
.rs-secname { flex: 1 1 auto; min-width: 0; }
.rs-sectype {
  font-size: 11px;
  color: var(--rs-ui-muted);
  background: #F2F4F7;
  padding: 1px 6px;
  border-radius: 4px;
  flex: 0 0 auto;
}
.rs-seccount { font-size: 11.5px; color: var(--rs-ui-faint); flex: 0 0 auto; }

.rs-warnbox-list { margin-bottom: 10px; }
.rs-warnline {
  font-size: 12px;
  color: var(--rs-ui-warn);
  background: #FFFAEB;
  border-radius: 5px;
  padding: 5px 9px;
  margin-bottom: 5px;
}

/* ---------- Toast ---------- */
.rs-toast {
  position: fixed;
  left: 50%;
  bottom: 34px;
  transform: translate(-50%, 12px);
  background: #101828;
  color: #fff;
  font-size: 12.5px;
  padding: 9px 16px;
  border-radius: 8px;
  opacity: 0;
  transition: opacity .22s ease, transform .22s ease;
  z-index: 200;
  pointer-events: none;
}
.rs-toast.is-in { opacity: 1; transform: translate(-50%, 0); }
.rs-toast-bad { background: var(--rs-ui-danger); }

/* ---------- 窄屏 ---------- */
@media (max-width: 980px) {
  .rs-main { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); }
  .rs-side { border-right: 0; border-bottom: 1px solid var(--rs-ui-line); }
  .rs-saved { display: none; }
}

/* ---------- 打印：只留 A4 文档 ---------- */
@media print {
  html, body { background: #fff !important; height: auto !important; }
  .rs-topbar, .rs-side, .rs-statusbar, .rs-modal, .rs-toast { display: none !important; }
  .rs-shell { display: block !important; height: auto !important; }
  .rs-main { display: block !important; }
  .rs-preview { display: block !important; background: #fff !important; }
  .rs-stage { padding: 0 !important; overflow: visible !important; background: #fff !important; }
  .rs-frame { height: auto !important; }
  .rs-scaler { position: static !important; transform: none !important; left: auto !important; }
  .rs-scaler .doc-page { box-shadow: none !important; margin: 0 auto; }
}

</style>

<body>

<div class="rs-shell">

  <header class="rs-topbar">
    <span class="rs-brand">简历工坊<span class="rs-brand-sub">Resume Studio</span></span>

    <div class="rs-dd">
      <button type="button" class="rs-btn" id="rsVersionBtn">版本：<span id="rsVersionLabel">默认版本</span> ▾</button>
      <div class="rs-menu" id="rsVersionMenu" hidden></div>
    </div>

    <span class="rs-saved" id="rsSavedNote">已自动保存至本机</span>
    <span class="rs-spacer"></span>

    <div class="rs-tb-group">
      <button type="button" class="rs-btn" id="rsThemeBtn">主题</button>
      <button type="button" class="rs-btn" id="rsCheckBtn">检查</button>
      <div class="rs-dd">
        <button type="button" class="rs-btn rs-btn-primary" id="rsExportBtn">导出 ▾</button>
        <div class="rs-menu" id="rsExportMenu" hidden>
          <button type="button" data-export="pdf">PDF（浏览器打印）</button>
          <button type="button" data-export="docx">Word 文档（.docx）</button>
          <button type="button" data-export="html">网页文件（.html）</button>
          <div class="rs-menu-sep"></div>
          <button type="button" data-export="json">备份数据（.json）</button>
        </div>
      </div>
      <div class="rs-dd">
        <button type="button" class="rs-btn" id="rsMoreBtn">更多 ▾</button>
        <div class="rs-menu" id="rsMoreMenu" hidden>
          <button type="button" data-more="import-resume">从旧简历导入…</button>
          <div class="rs-menu-sep"></div>
          <button type="button" data-more="shortcut">快捷键与小贴士</button>
          <div class="rs-menu-sep"></div>
          <button type="button" data-more="demo">载入示例数据</button>
          <button type="button" data-more="blank">新建空白简历</button>
          <button type="button" data-more="import">导入数据（.json）</button>
          <div class="rs-menu-sep"></div>
          <button type="button" data-more="clear">清空本机数据</button>
        </div>
      </div>
    </div>
  </header>

  <main class="rs-main">
    <aside class="rs-side">
      <div class="rs-form" id="rsForm"></div>
    </aside>

    <section class="rs-preview">
      <div class="rs-stage" id="rsStage">
        <div class="rs-frame" id="rsFrame">
          <div class="rs-scaler" id="rsScaler"></div>
        </div>
      </div>
      <footer class="rs-statusbar">
        <span id="rsPageInfo">正在准备预览…</span>
        <span id="rsWarn" class="rs-warnbox rs-ok"></span>
      </footer>
    </section>
  </main>

</div>

<div class="rs-modal" id="rsModal" hidden>
  <div class="rs-modal-box">
    <header>
      <span id="rsModalTitle">标题</span>

        cur[k] = /^\d+$/.test(parts[i + 1]) ? [] : {};

      cur = cur[k];
    }
    cur[parts[parts.length - 1]] = value;
    return obj;
  }

  function deepClone(obj) { return JSON.parse(JSON.stringify(obj)); }

  /** 归一化：补全缺失字段，保证渲染器不会拿到 undefined */
  function normalize(input) {
    var base = blank();
    var d = (input && typeof input === 'object') ? input : {};
    var out = deepClone(base);

    out.schemaVersion = SCHEMA_VERSION;
    out.meta = Object.assign({}, base.meta, d.meta || {});
    out.meta.facts = Array.isArray(out.meta.facts) ? out.meta.facts.filter(Boolean) : [];
    out.meta.contacts = Array.isArray(out.meta.contacts) ? out.meta.contacts : base.meta.contacts;
    out.intent = Object.assign({}, base.intent, d.intent || {});
    out.intent.positions = Array.isArray(out.intent.positions) ? out.intent.positions : [];
    out.intent.highlights = Array.isArray(out.intent.highlights) ? out.intent.highlights : [];
    out.summary = typeof d.summary === 'string' ? d.summary : '';
    out.theme = Object.assign({}, base.theme, d.theme || {});
    out.theme.tokens = (d.theme && d.theme.tokens) || {};
    out.versions = Array.isArray(d.versions) && d.versions.length ? d.versions : base.versions;

    var secs = Array.isArray(d.sections) ? d.sections : [];
    out.sections = secs.map(function (s) {
      var t = SECTION_TYPES.indexOf(s.type) >= 0 ? s.type : 'entry';
      var o = {
        id: s.id || uid('sec'),
        type: t,
        title: typeof s.title === 'string' ? s.title : '未命名板块',
        visible: s.visible !== false,
        note: typeof s.note === 'string' ? s.note : ''
      };
      if (t === 'entry') {
        o.items = (Array.isArray(s.items) ? s.items : []).map(function (it) {
          return {
            id: it.id || uid('item'),
            heading: it.heading || '',
            meta: it.meta || '',
            sub: it.sub || '',
            bullets: (Array.isArray(it.bullets) ? it.bullets : []).filter(function (b) { return String(b).trim() !== ''; })
          };
        });
      }
      if (t === 'kv') {
        o.pairs = (Array.isArray(s.pairs) ? s.pairs : []).map(function (p) {
          return { key: p.key || '', value: p.value || '' };
        });
      }
      if (t === 'list') o.bullets = Array.isArray(s.bullets) ? s.bullets : [];
      if (t === 'text') o.body = typeof s.body === 'string' ? s.body : '';
      return o;
    });

    return out;
  }

  /** 应用版本差量，返回新数据对象 */
  function applyOverrides(data, overrides) {
    var out = deepClone(data);
    var ov = overrides || {};
    Object.keys(ov).forEach(function (path) {
      setPath(out, path, deepClone(ov[path]));
    });
    return out;
  }

  RS.schema = {
    SCHEMA_VERSION: SCHEMA_VERSION,
    SECTION_TYPES: SECTION_TYPES,
    TYPE_LABEL: TYPE_LABEL,
    SECTION_PRESETS: SECTION_PRESETS,
    uid: uid,
    blank: blank,
    blankItem: blankItem,
    blankSection: blankSection,
    demo: demo,
    normalize: normalize,
    getPath: getPath,
    setPath: setPath,
    deepClone: deepClone,
    applyOverrides: applyOverrides
  };
})();

</script>
<script>
/**
 * 简历工坊 Resume Studio · 内联标记解析
 * 语法：**文字** → 加粗；换行 → <br> / 独立 run。
 * 为什么不用结构化 emphasis 数组：手写方便、导入导出无损、迁移友好。
 */
(function () {
  var RS = (typeof window !== 'undefined' ? (window.RS = window.RS || {}) : (globalThis.RS = globalThis.RS || {}));

  function escapeHtml(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  var BOLD_RE = /\*\*([\s\S]+?)\*\*/g;

  /** 解析为 run 列表：[{ text, bold }] */
  function toRuns(text) {
    var s = String(text === null || text === undefined ? '' : text);
    var runs = [];
    var last = 0;
    var m;
    BOLD_RE.lastIndex = 0;
    while ((m = BOLD_RE.exec(s)) !== null) {
      if (m.index > last) runs.push({ text: s.slice(last, m.index), bold: false });
      runs.push({ text: m[1], bold: true });
      last = m.index + m[0].length;
    }
    if (last < s.length) runs.push({ text: s.slice(last), bold: false });
    if (!runs.length) runs.push({ text: '', bold: false });
    return runs;
  }

  /** 转义后的安全 HTML */
  function toHtml(text) {
    return toRuns(text).map(function (r) {
      var t = escapeHtml(r.text).replace(/\n/g, '<br>');
      return r.bold ? '<b>' + t + '</b>' : t;
    }).join('');
  }

  /** 去掉标记的纯文本（用于长度统计、DOCX 文本） */
  function toPlain(text) {
    return String(text === null || text === undefined ? '' : text).replace(/\*\*/g, '');
  }

  /** 是否含有强调标记 */
  function hasBold(text) { return /\*\*[\s\S]+?\*\*/.test(String(text || '')); }

  RS.markup = {
    escapeHtml: escapeHtml,
    toRuns: toRuns,
    toHtml: toHtml,
    toPlain: toPlain,
    hasBold: hasBold
  };
})();

</script>
<script>
/**
 * 简历工坊 Resume Studio · HTML 渲染器
 * 输入 ResumeJSON，输出 A4 文档结构（视觉全部交给 document.css + 设计令牌）。
 * 渲染器只负责结构，不负责样式 —— 主题切换无需重新渲染。
 */
(function () {
  var RS = (typeof window !== 'undefined' ? (window.RS = window.RS || {}) : (globalThis.RS = globalThis.RS || {}));
  var md = RS.markup;

  function T(s) { return String(s === null || s === undefined ? '' : s).trim(); }

  function renderHeader(d) {
    var m = d.meta || {};
    var name = T(m.name);
    var photo = T(m.photo);
    var subBits = [];
    if (T(m.headline)) subBits.push(md.toHtml(T(m.headline)));
    var facts = (m.facts || []).map(T).filter(Boolean);
    if (facts.length) subBits.push(md.escapeHtml(facts.join(' · ')));

    var contacts = (m.contacts || []).filter(function (c) { return T(c && c.value); });
    var contactHtml = contacts.map(function (c) {
      return '<span>' + md.escapeHtml(T(c.label) ? T(c.label) + '：' : '') + md.toHtml(T(c.value)) + '</span>';
    }).join('');

    var who = [];
    if (name) who.push('<h1 class="doc-name">' + md.toHtml(name) + '</h1>');
    if (T(m.nameEn)) who.push('<div class="doc-name-en">' + md.escapeHtml(T(m.nameEn)) + '</div>');
    if (subBits.length) who.push('<div class="doc-sub">' + subBits.join(' ｜ ') + '</div>');
    if (contactHtml) who.push('<div class="doc-contact">' + contactHtml + '</div>');

    var photoHtml = photo ? '<img class="doc-photo" src="' + md.escapeHtml(photo) + '" alt="">' : '';
    if (!who.length && !photoHtml) return '';
    return '<header class="doc-header">' + photoHtml + '<div class="doc-who">' + who.join('') + '</div></header>';
  }

  function renderIntent(d) {
    var it = d.intent || {};
    var out = [];
    var positions = (it.positions || []).map(T).filter(Boolean);
    if (positions.length) {
      out.push('<div class="doc-intent"><span class="doc-intent-k">求职意向：</span>' +
        md.escapeHtml(positions.join('、')) + '</div>');
    }
    var tags = (it.highlights || []).map(T).filter(Boolean);
    if (tags.length) {
      out.push('<div class="doc-tags">' + tags.map(function (t) {
        return '<span>' + md.toHtml(t) + '</span>';
      }).join('<span class="doc-tag-sep">｜</span>') + '</div>');
    }
    return out.join('');
  }

  function renderSummary(d) {
    var s = T(d.summary);
    return s ? '<div class="doc-summary">' + md.toHtml(s) + '</div>' : '';
  }

  function renderEntryItems(items) {
    var html = [];
    (items || []).forEach(function (it) {
      var heading = T(it.heading);
      var metaText = T(it.meta);
      var sub = T(it.sub);
      var bullets = (it.bullets || []).map(T).filter(Boolean);
      if (!heading && !sub && !bullets.length) return;

      var head = '';
      if (heading || metaText) {
        head = '<div class="doc-item-head">' +
          '<span class="doc-item-title">' + md.toHtml(heading) + '</span>' +
          (metaText ? '<span class="doc-item-meta">' + md.escapeHtml(metaText) + '</span>' : '') +
          '</div>';
      }
      var subHtml = sub ? '<div class="doc-item-sub">' + md.toHtml(sub) + '</div>' : '';
      var ul = bullets.length ? '<ul class="doc-bullets">' + bullets.map(function (b) {
        return '<li>' + md.toHtml(b) + '</li>';
      }).join('') + '</ul>' : '';
      html.push('<div class="doc-item">' + head + subHtml + ul + '</div>');
    });
    return html.join('');
  }

  function renderKv(pairs) {
    var list = (pairs || []).filter(function (p) { return T(p && p.key) || T(p && p.value); });
    if (!list.length) return '';
    return '<ul class="doc-kv">' + list.map(function (p) {
      var k = T(p.key);
      return '<li>' + (k ? '<span class="doc-kv-k">' + md.escapeHtml(k) + '：</span>' : '') +
        md.toHtml(T(p.value)) + '</li>';
    }).join('') + '</ul>';
  }

  function renderList(bullets) {
    var list = (bullets || []).map(T).filter(Boolean);
    if (!list.length) return '';
    return '<ul class="doc-bullets">' + list.map(function (b) {
      return '<li>' + md.toHtml(b) + '</li>';
    }).join('') + '</ul>';
  }

  function renderSection(sec) {
    if (sec.visible === false) return '';
    var body = '';
    if (sec.type === 'entry') body = renderEntryItems(sec.items);
    else if (sec.type === 'kv') body = renderKv(sec.pairs);
    else if (sec.type === 'list') body = renderList(sec.bullets);
    else if (sec.type === 'text') body = T(sec.body) ? '<div class="doc-text">' + md.toHtml(T(sec.body)) + '</div>' : '';

    var title = T(sec.title);
    if (!body && !title) return '';
    if (!body) return '';

    var note = T(sec.note) ? '<div class="doc-note">' + md.toHtml(T(sec.note)) + '</div>' : '';
    return '<section class="doc-section" data-sec-title="' + md.escapeHtml(title) + '">' +
      (title ? '<h2 class="doc-h2">' + md.escapeHtml(title) + '</h2>' : '') +
      note + body + '</section>';
  }

  /** 主入口：ResumeJSON → A4 文档 HTML */
  function render(data) {
    var d = data || RS.schema.blank();
    var parts = ['<article class="doc-page" id="rsDocPage">'];
    parts.push(renderHeader(d));
    parts.push(renderIntent(d));
    parts.push(renderSummary(d));
    (d.sections || []).forEach(function (s) { parts.push(renderSection(s)); });
    parts.push('</article>');
    return parts.join('');
  }

  RS.renderHtml = { render: render };
})();

</script>
<script>
/**
 * 简历工坊 Resume Studio · 状态层
 * 职责：数据持有、本地自动存档、版本差量、变更广播。
 * 不碰 DOM，UI 通过 subscribe 订阅变更。
 */
(function () {
  var RS = (typeof window !== 'undefined' ? (window.RS = window.RS || {}) : (globalThis.RS = globalThis.RS || {}));

  var KEY = 'resume-studio:data:v1';
  var CHANGE_MS = 120;
  var SAVE_MS = 500;

  var state = { data: null, versionIndex: 0, storageOK: true, savedAt: 0 };
  var listeners = [];
  var changeTimer = null;
  var saveTimer = null;

  var _ls;
  /** 探测并缓存 localStorage 可用性（file:// 或隐私模式下可能不可用） */
  function storage() {
    if (_ls !== undefined) return _ls;
    _ls = null;
    try {
      if (typeof window !== 'undefined' && window.localStorage) {
        window.localStorage.setItem('resume-studio:probe', '1');
        window.localStorage.removeItem('resume-studio:probe');
        _ls = window.localStorage;
      }
    } catch (e) {
      _ls = null;
    }
    if (!_ls) state.storageOK = false;
    return _ls;
  }

  function read() {
    var ls = storage();
    if (!ls) return null;
    try {
      var raw = ls.getItem(KEY);
      if (!raw) return null;
      return RS.schema.normalize(JSON.parse(raw));
    } catch (e) {
      return null;
    }
  }

  function writeNow() {
    var ls = storage();
    if (!ls) return;
    try {
      ls.setItem(KEY, JSON.stringify(state.data));
      state.savedAt = Date.now();
    } catch (e) {
      state.storageOK = false;
    }
  }

  function scheduleSave() {
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(function () { writeNow(); emit('saved'); }, SAVE_MS);
  }

  /** 当前生效数据 = 主数据 + 当前版本差量 */
  function current() {
    if (!state.data) return null;
    var versions = state.data.versions || [];
    var v = versions[state.versionIndex] || versions[0];
    return RS.schema.applyOverrides(state.data, v ? v.overrides : {});
  }

  function emit(reason) {
    var d = current();
    listeners.forEach(function (fn) {
      try { fn(d, reason || 'change'); } catch (e) { console.error('[rs] listener error', e); }
    });
  }

  function scheduleChange() {
    if (changeTimer) clearTimeout(changeTimer);
    changeTimer = setTimeout(function () { emit('change'); }, CHANGE_MS);
  }

  function init(opts) {
    var loaded = read();
    if (loaded) {
      state.data = loaded;
    } else if (opts && opts.empty) {
      state.data = RS.schema.blank();
      writeNow();
    } else {
      state.data = RS.schema.demo();
      writeNow();
    }
    if (state.versionIndex >= state.data.versions.length) state.versionIndex = 0;
    return state.data;
  }

  /**
   * 写入字段。规则：若该路径在当前版本中已有差量，则写入差量（否则用户会「改了没反应」）；
   * 否则写入主数据，所有版本共享。
   */
  function set(path, value) {
    if (hasOverride(path)) {
      applyOverride(path, value, 'change');
      return;
    }
    RS.schema.setPath(state.data, path, value);
    scheduleChange();
    scheduleSave();
  }

  function hasOverride(path) {
    var v = versions()[state.versionIndex];
    return !!(v && v.overrides && Object.prototype.hasOwnProperty.call(v.overrides, path));
  }

  function get(path) { return RS.schema.getPath(state.data, path); }

  /** 结构性变更（增删板块/条目）：立即广播 */
  function mutate(fn) {
    fn(state.data);
    emit('structure');
    scheduleSave();
  }

  function replaceData(next) {
    state.data = RS.schema.normalize(next);
    state.versionIndex = 0;
    emit('replace');
    scheduleSave();
  }

  function resetEmpty() { replaceData(RS.schema.blank()); }
  function loadDemo() { replaceData(RS.schema.demo()); }
  function clearStorage() {
    var ls = storage();
    if (ls) ls.removeItem(KEY);
  }

  /* ---------- 版本 ---------- */
  function versions() { return state.data.versions || []; }
  function versionIndex() { return state.versionIndex; }

  function setVersion(i) {
    if (i < 0 || i >= versions().length) return;
    state.versionIndex = i;
    emit('version');
    scheduleSave();
  }

  function addVersion(name) {
    var n = (name || '').trim() || ('版本 ' + (versions().length + 1));
    state.data.versions.push({ name: n, overrides: {} });
    state.versionIndex = state.data.versions.length - 1;
    emit('version');
    scheduleSave();
  }

  function renameVersion(i, name) {
    if (!versions()[i]) return;
    versions()[i].name = name;
    emit('version');
    scheduleSave();
  }

  function removeVersion(i) {
    if (versions().length <= 1) return;
    state.data.versions.splice(i, 1);
    if (state.versionIndex >= state.data.versions.length) state.versionIndex = state.data.versions.length - 1;
    emit('version');
    scheduleSave();
  }

  /** 为当前版本设置差量字段；value 为空则移除该差量 */
  function applyOverride(path, value, reason) {
    var v = versions()[state.versionIndex];
    if (!v) return;
    v.overrides = v.overrides || {};
    var empty = value === '' || value === null || value === undefined ||
      (Array.isArray(value) && value.filter(Boolean).length === 0);
    if (empty) delete v.overrides[path];
    else v.overrides[path] = value;
    emit(reason || 'version');
    scheduleSave();
  }

  function setOverride(path, value) { applyOverride(path, value, 'version'); }

  function getOverride(path) {
    var v = versions()[state.versionIndex];
    if (!v || !v.overrides) return undefined;
    return Object.prototype.hasOwnProperty.call(v.overrides, path) ? v.overrides[path] : undefined;
  }

  function subscribe(fn) {
    listeners.push(fn);
    return function unsubscribe() {
      var i = listeners.indexOf(fn);
      if (i >= 0) listeners.splice(i, 1);
    };
  }

  function flush() {
    if (changeTimer) { clearTimeout(changeTimer); changeTimer = null; }
    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
    writeNow();
    emit('change');
  }

  RS.store = {
    init: init,
    current: current,
    raw: function () { return state.data; },
    set: set,
    get: get,
    mutate: mutate,
    replaceData: replaceData,
    resetEmpty: resetEmpty,
    loadDemo: loadDemo,
    clearStorage: clearStorage,
    subscribe: subscribe,
    flush: flush,
    versions: versions,
    versionIndex: versionIndex,
    setVersion: setVersion,
    addVersion: addVersion,
    renameVersion: renameVersion,
    removeVersion: removeVersion,
    setOverride: setOverride,
    getOverride: getOverride,
    storageOK: function () { return state.storageOK; },
    savedAt: function () { return state.savedAt; }
  };
})();

</script>
<script>
/**
 * 简历工坊 Resume Studio · 成稿检查规则引擎
 * C1–C8 通用默认开启；C9（敏感低分项）、C10（板块顺序）默认关闭，避免把个人策略硬编进工具。
 */
(function () {
  var RS = (typeof window !== 'undefined' ? (window.RS = window.RS || {}) : (globalThis.RS = globalThis.RS || {}));

  var config = {
    enabled: {
      C1: true, C2: true, C3: true, C4: true, C5: true,
      C6: true, C7: true, C8: true, C9: false, C10: false
    },
    maxBulletLen: 60,
    maxBulletsPerItem: 5,
    photoMaxKB: 300,
    /* C9：命中即提示「是否确要写在纸上」，默认空表 */
    keywords: []
  };

  /* 量化成果：数字 + 单位/符号 */
  var QUANT_RE = /(\d[\d,.]*\s*(?:\+|%|万|千|余|家|人次|份|个|次|人|篇|字|条|项|名|所|支))/;

  function plain(s) { return RS.markup.toPlain(s); }

  /** 返回文本中「未被 ** 强调」的量化词 */
  function unemphasizedQuant(text) {
    var parts = String(text === null || text === undefined ? '' : text).split(/\*\*/);
    for (var i = 0; i < parts.length; i += 2) {
      var m = parts[i].match(QUANT_RE);
      if (m) return m[1].trim();
    }
    return null;
  }

  function eachBullet(data, fn) {
    (data.sections || []).forEach(function (sec) {
      if (sec.type === 'entry') {
        (sec.items || []).forEach(function (it) {
          (it.bullets || []).forEach(function (b, k) {
            fn(b, { section: sec, item: it, title: sec.title, index: k });
          });
        });
      } else if (sec.type === 'list') {
        (sec.bullets || []).forEach(function (b, k) {
          fn(b, { section: sec, title: sec.title, index: k });
        });
      } else if (sec.type === 'kv') {
        (sec.pairs || []).forEach(function (p, k) {
          fn((p.key ? p.key + '：' : '') + (p.value || ''), { section: sec, title: sec.title, index: k, isKv: true });
        });
      }
    });
  }

  function isSectionEmpty(sec) {
    if (sec.type === 'entry') {
      return !(sec.items || []).some(function (it) {
        return String(it.heading || '').trim() ||
          String(it.sub || '').trim() ||
          (it.bullets || []).some(function (b) { return String(b).trim(); });
      });
    }
    if (sec.type === 'kv') return !(sec.pairs || []).some(function (p) { return String(p.value || '').trim(); });
    if (sec.type === 'list') return !(sec.bullets || []).some(function (b) { return String(b).trim(); });
    if (sec.type === 'text') return !String(sec.body || '').trim();
    return true;
  }

  function run(data, metrics) {
    var out = [];
    var E = config.enabled;

    /* C1 页数溢出 */
    if (E.C1 && metrics && metrics.pages > 1) {
      var heavy = metrics.heaviest && metrics.heaviest.title;
      out.push({
        code: 'C1', level: 'red',
        message: '内容超出 1 页（约占 ' + Number(metrics.ratio || 0).toFixed(2) + ' 页）' +
          (heavy ? '，建议优先精简「' + heavy + '」' : '') + '。简历单页是硬规矩。'
      });
    }

    /* C2 必填项 */
    if (E.C2) {
      var missing = [];
      if (!String(data.meta.name || '').trim()) missing.push('姓名');
      var hasContact = (data.meta.contacts || []).some(function (c) { return String(c.value || '').trim(); });
      if (!hasContact) missing.push('至少一项联系方式');
      if (!(data.intent.positions || []).length) missing.push('求职意向');
      if (missing.length) {
        out.push({ code: 'C2', level: 'red', message: '缺少必填内容：' + missing.join('、') + '。' });
      }
    }

    /* C3 量化成果未强调 */
    if (E.C3) {
      var quantHits = [];
      eachBullet(data, function (b, ctx) {
        var q = unemphasizedQuant(b);
        if (q) quantHits.push({ q: q, title: ctx.title });
      });
      if (quantHits.length) {
        var sample = quantHits.slice(0, 3).map(function (x) { return x.q + '（' + x.title + '）'; }).join('、');
        out.push({
          code: 'C3', level: 'yellow',
          message: '有 ' + quantHits.length + ' 处量化成果没加粗：' + sample +
            '。用 **' + quantHits[0].q + '** 包起来，HR 扫一眼就能看见。'
        });
      }
    }

    /* C4 时间格式不统一 */
    if (E.C4) {
      var dotStyle = 0, cnStyle = 0;
      (data.sections || []).forEach(function (sec) {
        (sec.items || []).forEach(function (it) {
          var t = String(it.meta || '');
          if (/\d{4}\s*\.\s*\d{1,2}/.test(t)) dotStyle++;
          if (/\d{4}\s*年/.test(t)) cnStyle++;
        });
      });
      if (dotStyle && cnStyle) {
        out.push({ code: 'C4', level: 'yellow', message: '时间格式两种写法混用（如 2023.09 与 2023 年 9 月），建议统一。' });
      }
    }

    /* C5 单条要点过长 */
    if (E.C5) {
      var longs = [];
      eachBullet(data, function (b, ctx) {
        if (ctx.isKv) return;
        var len = plain(b).length;
        if (len > config.maxBulletLen) longs.push({ len: len, title: ctx.title });
      });
      if (longs.length) {
        out.push({
          code: 'C5', level: 'yellow',
          message: '有 ' + longs.length + ' 条要点超过 ' + config.maxBulletLen + ' 字（最长 ' +
            Math.max.apply(null, longs.map(function (l) { return l.len; })) + ' 字），建议拆成两条或删掉修饰词。'
        });
      }
    }

    /* C6 单条目要点过多 */
    if (E.C6) {
      var crowded = [];
      (data.sections || []).forEach(function (sec) {
        (sec.items || []).forEach(function (it) {
          var n = (it.bullets || []).filter(function (b) { return String(b).trim(); }).length;
          if (n > config.maxBulletsPerItem) crowded.push(sec.title + '（' + n + ' 条）');
        });
      });
      if (crowded.length) {
        out.push({
          code: 'C6', level: 'yellow',
          message: '这些条目要点偏多：' + crowded.join('、') + '。建议每条最多 ' + config.maxBulletsPerItem + ' 条，留下最能打的。'
        });
      }
    }

    /* C7 显示中但内容为空的板块 */
    if (E.C7) {
      var empties = (data.sections || []).filter(function (s) { return s.visible !== false && isSectionEmpty(s); });
      if (empties.length) {
        out.push({
          code: 'C7', level: 'yellow',
          message: '有 ' + empties.length + ' 个板块显示中但没有任何内容：' +
            empties.map(function (s) { return '「' + s.title + '」'; }).join('') + '，建议填上或关掉显示。'
        });
      }
    }

    /* C8 照片体积 */
    if (E.C8) {
      var photo = String(data.meta.photo || '');
      if (photo.indexOf('data:') === 0) {
        var kb = Math.round(photo.length * 0.75 / 1024);
        if (kb > config.photoMaxKB) {
          out.push({ code: 'C8', level: 'yellow', message: '证件照约 ' + kb + 'KB，偏大。重新上传一次会自动压缩，或换张小图。' });
        }
      } else if (!photo) {
        out.push({ code: 'C8', level: 'gray', message: '未上传证件照（部分岗位不要求，可忽略）。' });
      }
    }

    /* C9 敏感低分项关键词 */
    if (E.C9 && config.keywords.length) {
      var hits = [];
      var allText = JSON.stringify(data);
      config.keywords.forEach(function (kw) {
        if (kw && allText.indexOf(kw) >= 0) hits.push(kw);
      });
      if (hits.length) {
        out.push({
          code: 'C9', level: 'gray',
          message: '命中你的敏感词表：' + hits.join('、') + '。确认这些是否真要写在纸上——纸上做减法，被问再坦诚答。'
        });
      }
    }

    /* C10 板块顺序建议 */
    if (E.C10) {
      var visible = (data.sections || []).filter(function (s) { return s.visible !== false; });
      var eduIdx = -1;
      visible.forEach(function (s, i) { if (String(s.title).indexOf('教育') >= 0 && eduIdx < 0) eduIdx = i; });
      var isStudent = /届|在读|应届/.test(String(data.meta.headline || ''));
      if (isStudent && eduIdx > 0) {
        out.push({ code: 'C10', level: 'gray', message: '应届生简历通常「教育背景」放第一位，当前它在第 ' + (eduIdx + 1) + ' 位。' });
      }
    }

    return out;
  }

  RS.lint = {
    run: run,
    config: config,
    isSectionEmpty: isSectionEmpty,
    unemphasizedQuant: unemphasizedQuant
  };
})();

</script>
<script>
/**
 * 简历工坊 Resume Studio · 极简 ZIP 打包
 * 只实现 OOXML 需要的部分：本地文件头 + 数据 + 中央目录 + EOCD。
 * 有 CompressionStream 时使用 deflate-raw（方式 8），否则退回 store（方式 0）——两者都是合法 ZIP。
 */
(function () {
  var RS = (typeof window !== 'undefined' ? (window.RS = window.RS || {}) : (globalThis.RS = globalThis.RS || {}));

  var CRC_TABLE = (function () {
    var t = new Int32Array(256);
    for (var n = 0; n < 256; n++) {
      var c = n;
      for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c;
    }
    return t;
  })();

  function crc32(bytes) {
    var c = -1;
    for (var i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ -1) >>> 0;
  }

  function toBytes(data) {
    if (data instanceof Uint8Array) return data;
    if (typeof data === 'string') {
      if (typeof TextEncoder !== 'undefined') return new TextEncoder().encode(data);
      var arr = [];
      for (var i = 0; i < data.length; i++) arr.push(data.charCodeAt(i) & 0xFF);
      return new Uint8Array(arr);
    }
    return new Uint8Array(data || []);
  }

  function deflateRaw(bytes) {
    if (typeof CompressionStream === 'undefined') return Promise.resolve(null);
    try {
      var cs = new CompressionStream('deflate-raw');
      var stream = new Blob([bytes]).stream().pipeThrough(cs);
      return new Response(stream).arrayBuffer().then(function (buf) {
        return new Uint8Array(buf);
      }).catch(function () { return null; });
    } catch (e) {
      return Promise.resolve(null);
    }
  }

  /* DOS 时间：固定为 2024-01-01 00:00，避免不同机器产出不同字节 */
  var DOS_TIME = 0;
  var DOS_DATE = ((2024 - 1980) << 9) | (1 << 5) | 1;

  function writeU16(a, off, v) { a[off] = v & 0xFF; a[off + 1] = (v >>> 8) & 0xFF; }
  function writeU32(a, off, v) {
    a[off] = v & 0xFF;
    a[off + 1] = (v >>> 8) & 0xFF;
    a[off + 2] = (v >>> 16) & 0xFF;
    a[off + 3] = (v >>> 24) & 0xFF;
  }

  /**
   * @param {Array<{name:string, data:string|Uint8Array, store?:boolean}>} files
   * @returns {Promise<Uint8Array>}
   */
  function build(files) {
    var entries = [];
    return Promise.all(files.map(function (f) {
      var raw = toBytes(f.data);
      var crc = crc32(raw);
      if (f.store) {
        return { nameBytes: toBytes(f.name), raw: raw, body: raw, method: 0, crc: crc };
      }
      return deflateRaw(raw).then(function (packed) {
        if (packed && packed.length < raw.length) {
          return { nameBytes: toBytes(f.name), raw: raw, body: packed, method: 8, crc: crc };
        }
        return { nameBytes: toBytes(f.name), raw: raw, body: raw, method: 0, crc: crc };
      });
    })).then(function (list) {
      var chunks = [];
      var offset = 0;

      list.forEach(function (e) {
        var head = new Uint8Array(30 + e.nameBytes.length);
        writeU32(head, 0, 0x04034b50);
        writeU16(head, 4, 20);
        writeU16(head, 6, 0x0800);          /* UTF-8 文件名 */
        writeU16(head, 8, e.method);
        writeU16(head, 10, DOS_TIME);
        writeU16(head, 12, DOS_DATE);
        writeU32(head, 14, e.crc);
        writeU32(head, 18, e.body.length);
        writeU32(head, 22, e.raw.length);
        writeU16(head, 26, e.nameBytes.length);
        writeU16(head, 28, 0);
        head.set(e.nameBytes, 30);

        entries.push({ e: e, offset: offset });
        chunks.push(head);
        chunks.push(e.body);
        offset += head.length + e.body.length;
      });

      var cdStart = offset;
      list.forEach(function (e, i) {
        var rec = entries[i];
        var cd = new Uint8Array(46 + e.nameBytes.length);
        writeU32(cd, 0, 0x02014b50);
        writeU16(cd, 4, 20);
        writeU16(cd, 6, 20);
        writeU16(cd, 8, 0x0800);
        writeU16(cd, 10, e.method);
        writeU16(cd, 12, DOS_TIME);
        writeU16(cd, 14, DOS_DATE);
        writeU32(cd, 16, e.crc);
        writeU32(cd, 20, e.body.length);
        writeU32(cd, 24, e.raw.length);
        writeU16(cd, 28, e.nameBytes.length);
        writeU16(cd, 30, 0);
        writeU16(cd, 32, 0);
        writeU16(cd, 34, 0);
        writeU16(cd, 36, 0);
        writeU32(cd, 38, 0);
        writeU32(cd, 42, rec.offset);
        cd.set(e.nameBytes, 46);
        chunks.push(cd);
        offset += cd.length;
      });

      var eocd = new Uint8Array(22);
      writeU32(eocd, 0, 0x06054b50);
      writeU16(eocd, 4, 0);
      writeU16(eocd, 6, 0);
      writeU16(eocd, 8, list.length);
      writeU16(eocd, 10, list.length);
      writeU32(eocd, 12, offset - cdStart);
      writeU32(eocd, 16, cdStart);
      writeU16(eocd, 20, 0);
      chunks.push(eocd);

      var total = chunks.reduce(function (s, c) { return s + c.length; }, 0);
      var out = new Uint8Array(total);
      var p = 0;
      chunks.forEach(function (c) { out.set(c, p); p += c.length; });
      return out;
    });
  }

  RS.zip = { build: build, crc32: crc32, toBytes: toBytes };
})();

</script>
<script>
/**
 * 简历工坊 Resume Studio · 极简 ZIP 读取
 * 只做 OOXML（docx）解析需要的事：读中央目录 → 定位条目 → 按需解压。
 * 支持 store（方式 0）与 deflate（方式 8，用原生 DecompressionStream）。
 */
(function () {
  var RS = (typeof window !== 'undefined' ? (window.RS = window.RS || {}) : (globalThis.RS = globalThis.RS || {}));

  function readU16(a, p) { return a[p] | (a[p + 1] << 8); }
  function readU32(a, p) { return (a[p] | (a[p + 1] << 8) | (a[p + 2] << 16) | (a[p + 3] << 24)) >>> 0; }

  function decodeUtf8(bytes) {
    if (typeof TextDecoder !== 'undefined') return new TextDecoder('utf-8').decode(bytes);
    var s = '';
    for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return decodeURIComponent(escape(s));
  }

  /** 从尾部寻找 EOCD（0x06054b50） */
  function findEOCD(bytes) {
    var start = Math.max(0, bytes.length - 22 - 65535);
    for (var i = bytes.length - 22; i >= start; i--) {
      if (bytes[i] === 0x50 && bytes[i + 1] === 0x4b && bytes[i + 2] === 0x05 && bytes[i + 3] === 0x06) return i;
    }
    return -1;
  }

  function readCentral(bytes, eocd) {
    var count = readU16(bytes, eocd + 10);
    var cdOffset = readU32(bytes, eocd + 16);
    var entries = [];
    var p = cdOffset;
    for (var i = 0; i < count; i++) {
      if (p + 46 > bytes.length || readU32(bytes, p) !== 0x02014b50) break;
      var method = readU16(bytes, p + 10);
      var crc = readU32(bytes, p + 16);
      var compSize = readU32(bytes, p + 20);
      var uncompSize = readU32(bytes, p + 24);
      var nameLen = readU16(bytes, p + 28);
      var extraLen = readU16(bytes, p + 30);
      var commentLen = readU16(bytes, p + 32);
      var localOffset = readU32(bytes, p + 42);
      var name = nameLen ? decodeUtf8(bytes.subarray(p + 46, p + 46 + nameLen)) : '';
      entries.push({
        name: name, method: method, crc: crc,
        compSize: compSize, uncompSize: uncompSize, localOffset: localOffset
      });
      p += 46 + nameLen + extraLen + commentLen;
    }
    return entries;
  }

  /** 从本地文件头定位真实数据起点（名称/额外字段长度可能与中央目录不同） */
  function dataSlice(bytes, entry) {
    var p = entry.localOffset;
    if (readU32(bytes, p) !== 0x04034b50) throw new Error('ZIP 本地文件头损坏');
    var nameLen = readU16(bytes, p + 26);
    var extraLen = readU16(bytes, p + 28);
    var start = p + 30 + nameLen + extraLen;
    return bytes.subarray(start, start + entry.compSize);
  }

  function inflateRaw(bytes) {
    if (typeof DecompressionStream === 'undefined') {
      return Promise.reject(new Error('当前浏览器不支持解压（缺少 DecompressionStream）'));
    }
    try {
      var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      return new Response(stream).arrayBuffer().then(function (buf) { return new Uint8Array(buf); });
    } catch (e) {
      return Promise.reject(e);
    }
  }

  /**
   * 读取整个 ZIP。
   * @param {ArrayBuffer|Uint8Array} input
   * @returns {Promise<{entries: Array, files: Object, text: Function}>}
   */
  function read(input) {
    var bytes = input instanceof Uint8Array ? input : new Uint8Array(input);
    var eocd = findEOCD(bytes);
    if (eocd < 0) return Promise.reject(new Error('不是有效的 docx / zip 文件'));

    var entries = readCentral(bytes, eocd);
    if (!entries.length) return Promise.reject(new Error('压缩包内没有可读条目'));

    var files = {};
    var jobs = entries.map(function (e) {
      var raw;
      try {
        raw = dataSlice(bytes, e);
      } catch (err) {
        return Promise.resolve();
      }
      if (e.method === 0) {
        files[e.name] = raw;
        return Promise.resolve();
      }
      if (e.method === 8) {
        return inflateRaw(raw).then(function (d) { files[e.name] = d; }).catch(function () { /* 跳过坏条目 */ });
      }
      return Promise.resolve();
    });

    return Promise.all(jobs).then(function () {
      return { entries: entries, files: files, text: toText };
    });
  }

  function toText(bytes) { return decodeUtf8(bytes); }

  RS.unzip = { read: read, decodeUtf8: decodeUtf8 };
})();

</script>

/**

  var WP = 'http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing';
  var R = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';

  var PAGE_W = 11906;
  var PAGE_H = 16838;
  var CONTENT_W = 9746;   /* 11906 - 1080 × 2 */

  function escX(s) {

      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')

      '<wp:inline distT="0" distB="0" distL="0" distR="0" xmlns:wp="' + WP + '" xmlns:r="' + R + '" xmlns:a="' + A + '" xmlns:pic="' + PIC + '">' +
      '<wp:extent cx="' + t.docxPhotoW + '" cy="' + t.docxPhotoH + '"/>' +
      '<wp:effectExtent l="0" t="0" r="0" b="0"/>' +
      '<wp:docPr id="100" name="photo"/>' +
      '<wp:cNvGraphicFramePr><a:graphicFrameLocks noChangeAspect="1"/></wp:cNvGraphicFramePr>' +
      '<a:graphic xmlns:a="' + A + '"><a:graphicData uri="' + PIC + '">' +
      '<pic:pic xmlns:pic="' + PIC + '">' +
      '<pic:nvPicPr><pic:cNvPr id="0" name="photo.jpg"/><pic:cNvPicPr/></pic:nvPicPr>' +
      '<pic:blipFill><a:blip r:embed="' + rId + '"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>' +
      '<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="' + t.docxPhotoW + '" cy="' + t.docxPhotoH + '"/></a:xfrm>' +
      '<a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr>' +
