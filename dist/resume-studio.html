      '<w:tblW w:w="0" w:type="auto"/><w:tblLayout w:type="fixed"/>' +
      '<w:tblBorders>' +
      '<w:top w:val="none" w:sz="0" w:space="0" w:color="auto"/>' +
      '<w:left w:val="none" w:sz="0" w:space="0" w:color="auto"/>' +
      '<w:bottom w:val="single" w:sz="8" w:space="2" w:color="' + RS.tokens.toHex(t.accent) + '"/>' +
      '<w:right w:val="none" w:sz="0" w:space="0" w:color="auto"/>' +
      '</w:tblBorders>' +
      '<w:tblCellMar><w:top w:w="0" w:type="dxa"/><w:left w:w="0" w:type="dxa"/><w:bottom w:w="0" w:type="dxa"/><w:right w:w="60" w:type="dxa"/></w:tblCellMar>' +
      '</w:tblPr>' +
      '<w:tblGrid><w:gridCol w:w="' + leftW + '"/><w:gridCol w:w="' + rightW + '"/></w:tblGrid>' +
      '<w:tr>' +
      '<w:tc><w:tcPr><w:tcW w:w="' + leftW + '" w:type="dxa"/><w:vAlign w:val="center"/></w:tcPr>' +
      '<w:p><w:pPr><w:spacing w:after="0" w:line="240" w:lineRule="auto"/></w:pPr>' + photoRun(t, 'rId3') + '</w:p>' +
      '</w:tc>' +
      '<w:tc><w:tcPr><w:tcW w:w="' + rightW + '" w:type="dxa"/><w:vAlign w:val="center"/></w:tcPr>' +
      who.join('') +
      '</w:tc></w:tr></w:tbl>';
  }

  /* ---------- 主体 ---------- */
  function intentBlock(data, t) {
    var out = [];
    var it = data.intent || {};
    var positions = (it.positions || []).filter(Boolean);
    if (positions.length) {
      out.push(para(
        run('求职意向：', { bold: true, size: t.docxFsBullet, color: RS.tokens.toHex(t.accent) }, t.docxFont) +
        run(positions.join('、'), { size: t.docxFsBullet, color: RS.tokens.toHex(t.accent) }, t.docxFont),
        { after: 60, shade: RS.tokens.toHex(t.accentSoft) }));
    }
    var tags = (it.highlights || []).filter(Boolean);
    if (tags.length) {
      out.push(para(runsFromMarkup(tags.join(' ｜ '), { size: t.docxFsContact, color: '374151' }, t.docxFont),
        { after: 110, shade: RS.tokens.toHex(t.tagSoft) }));
    }
    return out.join('');
  }

  function summaryBlock(data, t) {
    var s = String(data.summary || '').trim();
    if (!s) return '';
    return para(runsFromMarkup(s, { size: t.docxFsBullet, color: '374151' }, t.docxFont), { after: 80 });
  }

  function sectionBlock(sec, t) {
    if (sec.visible === false) return '';
    var title = String(sec.title || '').trim();
    var body = [];
    var hasBody = false;

    if (sec.type === 'entry') {
      (sec.items || []).forEach(function (it) {
        var head = String(it.heading || '').trim();
        var metaT = String(it.meta || '').trim();
        var sub = String(it.sub || '').trim();
        var bullets = (it.bullets || []).filter(function (b) { return String(b).trim(); });
        if (!head && !sub && !bullets.length) return;
        hasBody = true;

        if (head || metaT) {
          var runs = runsFromMarkup(head, { size: t.docxFsItem, bold: true, color: '111827' }, t.docxFont);
          if (metaT) {
            runs += run('\t', { size: t.docxFsNote }, t.docxFont);
            runs += run(metaT, { size: t.docxFsNote, color: '4B5563' }, t.docxFont);
          }
          body.push(para(runs, { after: 20, tabs: true }));
        }
        if (sub) body.push(para(runsFromMarkup(sub, { size: t.docxFsNote, color: '6B7280' }, t.docxFont), { after: 20 }));
        bullets.forEach(function (b) {
          body.push(bulletPara(runsFromMarkup(b, { size: t.docxFsBullet }, t.docxFont)));
        });
      });
    } else if (sec.type === 'kv') {
      (sec.pairs || []).forEach(function (p) {
        var key = String(p.key || '').trim();
        var val = String(p.value || '').trim();
        if (!key && !val) return;
        hasBody = true;
        var runs = key ? run(key + '：', { bold: true, size: t.docxFsBullet, color: RS.tokens.toHex(t.accent) }, t.docxFont) : '';
        runs += runsFromMarkup(val, { size: t.docxFsBullet }, t.docxFont);
        body.push(bulletPara(runs, 30));
      });
    } else if (sec.type === 'list') {
      (sec.bullets || []).filter(function (b) { return String(b).trim(); }).forEach(function (b) {
        hasBody = true;
        body.push(bulletPara(runsFromMarkup(b, { size: t.docxFsBullet }, t.docxFont)));
      });
    } else if (sec.type === 'text') {
      var txt = String(sec.body || '').trim();
      if (txt) {
        hasBody = true;
        body.push(para(runsFromMarkup(txt, { size: t.docxFsBullet }, t.docxFont), { after: 60 }));
      }
    }

    if (!hasBody) return '';
    var out = title ? h2(title, t) : '';
    var note = String(sec.note || '').trim();
    if (note) {
      out += para(runsFromMarkup(note, { size: t.docxFsNote, italic: true, color: '6B7280' }, t.docxFont), { after: 40 });
    }
    return out + body.join('');
  }

  function documentXml(data, t) {
    var m = data.meta || {};
    var hasPhoto = isDataImage(m.photo);
    var body = [];
    body.push(headerBlock(data, t, hasPhoto));
    body.push(intentBlock(data, t));
    body.push(summaryBlock(data, t));
    (data.sections || []).forEach(function (sec) { body.push(sectionBlock(sec, t)); });

    var sectPr = '<w:sectPr><w:pgSz w:w="' + PAGE_W + '" w:h="' + PAGE_H + '"/>' +
      '<w:pgMar w:top="' + t.docxMarginTop + '" w:right="' + t.docxMarginX + '" w:bottom="' + t.docxMarginBottom +
      '" w:left="' + t.docxMarginX + '" w:header="720" w:footer="720" w:gutter="0"/></w:sectPr>';

    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<w:document xmlns:w="' + W + '"><w:body>' + body.join('') + sectPr + '</w:body></w:document>';
  }

  function isDataImage(src) {
    return /^data:image\//.test(String(src || ''));
  }

  function parseDataImage(src) {
    var m = /^data:(image\/[a-zA-Z+]+);base64,(.*)$/.exec(String(src || ''));
    if (!m) return null;
    var mime = m[1];
    var ext = mime === 'image/png' ? 'png' : (mime === 'image/gif' ? 'gif' : 'jpg');
    var bin = (typeof atob === 'function' ? atob(m[2]) : Buffer.from(m[2], 'base64').toString('binary'));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return { bytes: bytes, mime: mime, ext: ext };
  }

  /* ---------- 包结构 ---------- */
  function stylesXml(t) {
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<w:styles xmlns:w="' + W + '">' +
      '<w:docDefaults><w:rPrDefault><w:rPr>' +
      '<w:rFonts w:ascii="' + t.docxFont + '" w:hAnsi="' + t.docxFont + '" w:eastAsia="' + t.docxFont + '" w:cs="' + t.docxFont + '"/>' +
      '<w:sz w:val="' + t.docxFsBullet + '"/><w:szCs w:val="' + t.docxFsBullet + '"/></w:rPr></w:rPrDefault>' +
      '<w:pPrDefault><w:pPr><w:spacing w:after="80" w:line="276" w:lineRule="auto"/></w:pPr></w:pPrDefault>' +
      '</w:docDefaults>' +
      '<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style>' +
      '</w:styles>';
  }

  function numberingXml() {
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<w:numbering xmlns:w="' + W + '">' +
      '<w:abstractNum w:abstractNumId="0">' +
      '<w:multiLevelType w:val="hybridMultilevel"/>' +
      '<w:lvl w:ilvl="0"><w:start w:val="1"/><w:numFmt w:val="bullet"/><w:lvlText w:val="\u2022"/>' +
      '<w:lvlJc w:val="left"/><w:pPr><w:ind w:left="360" w:hanging="220"/></w:pPr>' +
      '<w:rPr><w:rFonts w:ascii="Symbol" w:hAnsi="Symbol" w:hint="default"/></w:rPr></w:lvl>' +
      '</w:abstractNum>' +
      '<w:num w:numId="1"><w:abstractNumId w:val="0"/></w:num>' +
      '</w:numbering>';
  }

  function contentTypesXml(imgExt) {
    var img = imgExt
      ? '<Override PartName="/word/media/photo.' + imgExt + '" ContentType="image/' +
        (imgExt === 'png' ? 'png' : (imgExt === 'gif' ? 'gif' : 'jpeg')) + '"/>'
      : '';
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Types xmlns="' + PKG + '">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>' +
      '<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>' +
      '<Override PartName="/word/numbering.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.numbering+xml"/>' +
      '<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>' +
      '<Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/>' +
      img +
      '</Types>';
  }

  function rootRelsXml() {
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="' + PKG + '">' +
      '<Relationship Id="rId1" Type="' + DOC + '/officeDocument" Target="word/document.xml"/>' +
      '<Relationship Id="rId2" Type="' + PKG + '/metadata/core-properties" Target="docProps/core.xml"/>' +
      '<Relationship Id="rId3" Type="' + DOC + '/extended-properties" Target="docProps/app.xml"/>' +
      '</Relationships>';
  }

  function docRelsXml(hasPhoto, imgExt) {
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="' + PKG + '">' +
      '<Relationship Id="rId1" Type="' + DOC + '/styles" Target="styles.xml"/>' +
      '<Relationship Id="rId2" Type="' + DOC + '/numbering" Target="numbering.xml"/>' +
      (hasPhoto ? '<Relationship Id="rId3" Type="' + DOC + '/image" Target="media/photo.' + imgExt + '"/>' : '') +
      '</Relationships>';
  }

  function coreXml(data) {
    var name = String((data.meta && data.meta.name) || '').trim() || '简历';
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<cp:coreProperties xmlns:cp="' + CP + '" xmlns:dc="' + DC + '" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">' +
      '<dc:title>' + escX(name + ' 简历') + '</dc:title>' +
      '<dc:creator>' + escX(name) + '</dc:creator>' +
      '</cp:coreProperties>';
  }

  function appXml() {
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Properties xmlns="' + EP + '" xmlns:vt="' + VT + '"><Application>简历工坊 Resume Studio</Application></Properties>';
  }

  /* ---------- 打包 ---------- */
  function buildFiles(data) {
    var t = RS.tokens.resolve(data.theme || {});
    var img = isDataImage(data.meta && data.meta.photo) ? parseDataImage(data.meta.photo) : null;
    var files = [
      { name: '[Content_Types].xml', data: contentTypesXml(img ? img.ext : null) },
      { name: '_rels/.rels', data: rootRelsXml() },
      { name: 'word/document.xml', data: documentXml(data, t) },
      { name: 'word/styles.xml', data: stylesXml(t) },
      { name: 'word/numbering.xml', data: numberingXml() },
      { name: 'word/_rels/document.xml.rels', data: docRelsXml(!!img, img ? img.ext : 'jpg') },
      { name: 'docProps/core.xml', data: coreXml(data) },
      { name: 'docProps/app.xml', data: appXml() }
    ];
    if (img) files.push({ name: 'word/media/photo.' + img.ext, data: img.bytes, store: true });
    return files;
  }

  function build(data) {
    return RS.zip.build(buildFiles(data));
  }

  function exportDocx(data) {
    var name = RS.io.safeFileName(((data.meta && data.meta.name) || 'resume') + '-简历', '.docx');
    return build(data).then(function (bytes) {
      RS.io.download(name, new Blob([bytes], {
        type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
      }));
      return bytes.length;
    });
  }

  RS.renderDocx = {
    build: build,
    buildFiles: buildFiles,
    documentXml: documentXml,
    export: exportDocx
  };
})();

</script>
<script>
/**
 * 简历工坊 Resume Studio · DOCX 文本提取
 * docx 本质是 ZIP + XML，这里把 word/document.xml 还原成「逐行文本」，
 * 交给 core/parse-text.js 做结构化。不依赖 DOMParser，浏览器与 Node 行为一致。
 */
(function () {
  var RS = (typeof window !== 'undefined' ? (window.RS = window.RS || {}) : (globalThis.RS = globalThis.RS || {}));

  function unescapeXml(s) {
    return String(s)
      .replace(/&lt;/g, '<')
      .replace(/&gt;/g, '>')
      .replace(/&quot;/g, '"')
      .replace(/&apos;/g, "'")
      .replace(/&#(\d+);/g, function (m, d) { return String.fromCharCode(Number(d)); })
      .replace(/&amp;/g, '&');
  }

  /** 抽取单个 w:p 内的文本（w:t 取文，w:tab 转换表符，w:br 转换行） */
  function paraText(pXml) {
    var out = '';
    var re = /<w:t(?:\s[^>]*)?>([\s\S]*?)<\/w:t>|<w:t(?:\s[^>]*)?\/>|<w:tab(?:\s[^>]*)?\/>|<w:br(?:\s[^>]*)?\/>/g;
    var m;
    while ((m = re.exec(pXml)) !== null) {
      if (m[0].indexOf('<w:tab') === 0) out += '\t';
      else if (m[0].indexOf('<w:br') === 0) out += '\n';
      else if (m[1] !== undefined) out += unescapeXml(m[1]);
    }
    return out;
  }

  /** 把 document.xml 拆成段落文本数组（保持文档顺序） */
  function extractLines(xml) {
    var lines = [];
    var re = /<w:p(?:\s[^>]*)?>[\s\S]*?<\/w:p>|<w:p(?:\s[^>]*)?\/>/g;
    var m;
    while ((m = re.exec(xml)) !== null) {
      var t = paraText(m[0]);
      /* 段落内的软换行拆成独立行，便于后续结构化 */
      String(t).split('\n').forEach(function (part) { lines.push(part); });
    }
    return lines;
  }

  /**
   * 解析 docx 文件
   * @param {ArrayBuffer} arrayBuffer
   * @returns {Promise<{lines: string[], source: string}>}
   */
  function parse(arrayBuffer) {
    return RS.unzip.read(arrayBuffer).then(function (zip) {
      var doc = zip.files['word/document.xml'];
      if (!doc) throw new Error('这不是 Word 文档（缺少 word/document.xml）');
      var xml = RS.unzip.decodeUtf8(doc);
      return { lines: extractLines(xml), source: 'docx' };
    });
  }

  RS.parseDocx = { parse: parse, extractLines: extractLines, paraText: paraText };
})();

</script>
<script>
/**
 * 简历工坊 Resume Studio · 文本结构化解析
 * 把「逐行文本」（来自 docx 或直接粘贴）启发式还原成 ResumeJSON。
 * 设计原则：宁少勿错 —— 拿不准的就不填，用户改比重填容易。
 */
(function () {
  var RS = (typeof window !== 'undefined' ? (window.RS = window.RS || {}) : (globalThis.RS = globalThis.RS || {}));

  /* ---------- 规则表 ---------- */
  var SECTION_KEYS = [
    { re: /^(教育背景|教育经历|学习经历|教育情况|教育与培训|教育)$/, type: 'entry', title: '教育背景' },
    { re: /^(实习经历|实习经验|工作经历|工作经验|职业经历|任职经历|实践经历)$/, type: 'entry', title: '实习经历' },
    { re: /^(项目经历|项目经验|科研经历|研究经历|竞赛经历|比赛经历|获奖项目)$/, type: 'entry', title: '项目 · 竞赛 · 实践' },
    { re: /^(校园经历|在校经历|学生工作|社团经历|社会实践|社会活动|组织经历)$/, type: 'entry', title: '校园经历' },
    { re: /^(专业技能|技能特长|技能证书|技能|计算机能力|语言能力|证书|资质)$/, type: 'kv', title: '专业技能' },
    { re: /^(荣誉奖项|获奖情况|奖项荣誉|奖学金|获奖|荣誉|表彰)$/, type: 'list', title: '荣誉奖项' },
    { re: /^(自我评价|个人评价|个人简介|自我介绍|关于我|个人优势|自我描述)$/, type: 'text', title: '自我评价' },
    { re: /^(?:可提供的|可提供|相关|其他|补充)?(?:证明材料|证明|作品集|作品|附件|补充材料)$/, type: 'list', title: '可提供的证明材料' }
  ];

  /* 兜底：形如「田野调研经历 / 志愿活动 / 项目 · 竞赛 · 在校实践 / 技术实践 · AI 与开源」的自定义板块名 */
  var LOOSE_SECTION_RE = /^[\u4e00-\u9fa5A-Za-z·\s]{2,14}(?:经历|实践|调研|调查|活动|开源|成果|作品|特长)$/;

  var TIME_RE = /(\d{4}\s*[.\-/年]\s*\d{0,2}\s*月?)\s*[–—\-~至到]+\s*(\d{4}\s*[.\-/年]\s*\d{0,2}\s*月?|至今|现在|今|present|now)/i;
  var SINGLE_TIME_RE = /[（(]\s*(\d{4}\s*[.\-/年]\s*\d{1,2}\s*月?)\s*[）)]/;
  var PHONE_RE = /1[3-9]\d[\s-]?\d{4}[\s-]?\d{4}/g;
  var EMAIL_RE = /[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g;
  var LINK_RE = /(?:https?:\/\/)?(?:www\.)?(?:github\.com|gitee\.com|gitlab\.com|[\w-]+\.(?:com|cn|net|org|io|me|dev|top))(?:\/[\w\-.#?=&%]+)*/gi;
  var BULLET_RE = /^[\s]*[•·▪◦‣∙*＊\-–—○●]+\s*/;
  /* 板块导语特征：明显的总结性表述，例如「三次调研累计产出约 3 万字」 */
  var NOTE_HINT_RE = /累计|共计|合计|总计|共\s*\d|约\s*\d|累计产出|累计完成/;
  /* 补充说明特征：课程/培养方向这类文字更适合放在条目下方的小字里 */
  var SUB_HINT_RE = /^(主修|课程|专业课程|核心课程|所学课程|研究方向|培养方向|主要课程)/;
  var NAME_BAD_RE = /简历|个人|应聘|求职|电话|手机|邮箱|地址|大学|学院|学校|专业|本科|硕士|博士|应届|届|@|\d|：|:/;
  var FACT_RULES = [
    { label: '', re: /\d{1,2}\s*岁/ },
    { label: '', re: /^(男|女)$/ },
    { label: '', re: /^(汉族|回族|满族|壮族|苗族|土家族|彝族|藏族|蒙古族)$/ },
    { label: '', re: /^(中共党员|中共预备党员|共青团员|群众|民主党派)$/ }
  ];

  function uid(p) { return RS.schema.uid(p); }

  /** 联系方式去重（同一个 GitHub 链接常在简历里出现多次） */
  function dedupe(list) {
    var seen = {};
    return (list || []).filter(function (c) {
      var k = c.label + '|' + c.value;
      if (seen[k]) return false;
      seen[k] = 1;
      return true;
    });
  }

  /* ---------- 预处理 ---------- */
  function preprocess(input) {
    var raw = Array.isArray(input) ? input : String(input === null || input === undefined ? '' : input).split(/\r?\n/);
    return raw.map(function (l) {
      return String(l).replace(/\u00a0/g, ' ').replace(/[ ]{2,}/g, ' ').replace(/^[\s]+|[\s]+$/g, '');
    });
  }

  function cleanTitle(line) {
    return String(line)
      .replace(/^[\s（(【\[]*/, '')
      .replace(/^[一二三四五六七八九十\d]{1,2}\s*[、.．)）】\]]\s*/, '')
      .replace(/[:：\s]+$/, '')
      .replace(/[（(【\[].*?[）)】\]]/g, '')
      .replace(/[\s]+/g, '')
      .trim();
  }

  function stripBullet(line) {
    return String(line).replace(BULLET_RE, '').trim();
  }

  function cleanHeading(s) {
    return String(s)
      .replace(/\t/g, ' ')
      .replace(/[（(]\s*[）)]/g, ' ')
      .replace(/[\s]{2,}/g, ' ')
      .replace(/^[\s\-–—·、,，:：|｜]+/, '')
      .replace(/[\s\-–—·、,，:：|｜]+$/, '')
      .trim();
  }

  function matchSection(line) {
    var t = cleanTitle(line);
    if (!t || t.length > 14) return null;
    for (var i = 0; i < SECTION_KEYS.length; i++) {
      if (SECTION_KEYS[i].re.test(t)) return SECTION_KEYS[i];
    }
    if (t.length <= 14 && LOOSE_SECTION_RE.test(t)) {
      var raw = String(line).replace(/\t[\s\S]*$/, '').trim();
      return { type: 'entry', title: raw || t, loose: true };
    }
    return null;
  }

  /* ---------- 联系方式收割 ---------- */
  function harvest(line, acc) {
    var rest = String(line);
    function take(re) {
      var g = new RegExp(re.source, re.flags.indexOf('g') >= 0 ? re.flags : re.flags + 'g');
      var hits = rest.match(g) || [];
      hits.forEach(function (h) { rest = rest.replace(h, ' '); });
      return hits;
    }
    var emails = take(EMAIL_RE);
    var phones = take(PHONE_RE);
    var wx = /(?:微信|WeChat|wechat)\s*[:：]?\s*([A-Za-z0-9_.\-]{4,})/.exec(rest);
    if (wx) rest = rest.replace(wx[0], ' ');
    var qq = /QQ\s*[:：]?\s*([0-9]{5,12})/i.exec(rest);
    if (qq) rest = rest.replace(qq[0], ' ');

    var links = [];
    var lm;
    var linkRe = new RegExp(LINK_RE.source, 'gi');
    while ((lm = linkRe.exec(rest)) !== null) {
      /* 已在本行出现过的邮箱域名不算链接 */
      if (emails.some(function (e) { return e.indexOf(lm[0]) >= 0; })) continue;
      links.push(lm[0]);
      rest = rest.replace(lm[0], ' ');
    }

    emails.forEach(function (e) { acc.contacts.push({ label: '邮箱', value: e }); });
    phones.forEach(function (p) { acc.contacts.push({ label: '电话', value: p.replace(/[\s-]/g, '') }); });
    links.forEach(function (l) { acc.contacts.push({ label: '链接', value: l.replace(/^https?:\/\//, '') }); });
    if (wx) acc.contacts.push({ label: '微信', value: wx[1] });
    if (qq) acc.contacts.push({ label: 'QQ', value: qq[1] });

    return rest.replace(/[（(]\s*[）)]/g, ' ').replace(/[\s]{2,}/g, ' ').replace(/^[:：、,，|｜\s]+|[:：、,，|｜\s]+$/g, '').trim();
  }

  /* ---------- 头部信息 ---------- */
  function detectName(lines) {
    for (var i = 0; i < Math.min(lines.length, 10); i++) {
      var l = lines[i];
      var m = /^(?:姓名|名字)\s*[:：]\s*(.+)$/.exec(l);
      if (m) return cleanHeading(m[1]).replace(/[\s]/g, '');
      /* 姓名常被排版成「王 坤 森」，先去空格再判断 */
      var t = String(l).replace(/\s|\t/g, '');
      if (!/^[\u4e00-\u9fa5·]{2,4}$/.test(t)) continue;
      if (NAME_BAD_RE.test(t)) continue;
      if (matchSection(l)) continue;   /* 别把「教育背景」这种板块标题当姓名 */
      return t;
    }
    return '';
  }

  function detectHeadline(lines, name) {
    for (var i = 0; i < Math.min(lines.length, 12); i++) {
      var t = lines[i];
      if (!t || t === name) continue;
      if (/届|应届|在读|本科|硕士|博士|研究生|大学|学院/.test(t) && t.length <= 60) {
        var plain = t.replace(/\t/g, ' ｜ ').trim();
        if (plain) return plain;
      }
    }
    return '';
  }

  function detectIntent(lines) {
    for (var i = 0; i < lines.length; i++) {
      var m = /^(?:求职意向|应聘职位|意向岗位|目标岗位|求职目标|应聘意向)\s*[:：]?\s*(.+)$/.exec(lines[i]);
      if (m) {
        /* 注意：不要把「/」当分隔符 —— 「市场/用户研究」是一个整体 */
        return m[1].split(/[、,，|｜；;]/).map(function (s) { return s.trim(); }).filter(Boolean);
      }
    }
    return [];
  }

  function detectFacts(lines) {
    var facts = [];
    lines.slice(0, 14).forEach(function (l) {
      var parts = l.split(/[\s｜|·、]+/);
      parts.forEach(function (p) {
        var t = p.trim();
        if (!t || t.length > 8) return;
        for (var i = 0; i < FACT_RULES.length; i++) {
          if (FACT_RULES[i].re.test(t) && facts.indexOf(t) < 0) { facts.push(t); return; }
        }
      });
    });
    return facts.slice(0, 6);
  }

  /* ---------- 条目切分 ---------- */
  function splitHeadingTime(line) {
    var meta = '';
    var heading = line;
    var m = TIME_RE.exec(line);
    if (m) {
      meta = m[0].replace(/\s*[–—\-~至到]+\s*/, ' – ').replace(/\s{2,}/g, ' ').trim();
      heading = (line.slice(0, m.index) + ' ' + line.slice(m.index + m[0].length));
    } else {
      var m2 = SINGLE_TIME_RE.exec(line);
      if (m2) {
        meta = m2[1];
        heading = line.replace(m2[0], ' ');
      }
    }
    return { heading: cleanHeading(heading), meta: meta };
  }

  /* 组织/机构特征词：用于区分「XX大学XX协会 — 部长：职责」与「严格执行流程：甲乙丙丁」 */
  var ORG_HINT_RE = /大学|学院|学校|公司|集团|协会|中心|研究院|研究所|实验室|社团|委员会|部门|机构|银行|医院|中学|工作室|基金会/;

  function looksLikeHeading(line, curItem) {
    var t = stripBullet(line);
    if (!t) return false;
    if (TIME_RE.test(line) || SINGLE_TIME_RE.test(line)) return true;

    /* 「单位 — 职位：职责」格式：冒号前必须带组织名或破折号，才认定是新条目标题 */
    var m = /^(.{4,34}?)\s*[:：]\s*(.{8,})$/.exec(t);
    if (m && !/[。；;]/.test(m[1]) && (ORG_HINT_RE.test(m[1]) || /[—–-]/.test(m[1]))) return true;

    /* 短行 + 当前条目已有要点 → 新条目标题 */
    if (t.length <= 24 && !/[。；;]$/.test(t) && curItem && curItem.bullets.length > 0) return true;
    return false;
  }

  function parseEntrySection(lines) {
    var items = [];
    var note = '';
    var cur = null;

    function pushItem(heading, meta) {
      var h = heading || '';
      var first = '';
      /* 长句里「：」之后通常是要点，不该算作标题的一部分 */
      var m = /^(.{4,34}?)\s*[:：]\s*(.{8,})$/.exec(h);
      if (m) { h = m[1]; first = m[2].trim(); }
      cur = {
        id: uid('item'), heading: cleanHeading(h), meta: meta || '',
        sub: '', bullets: first ? [first] : []
      };
      items.push(cur);
      return cur;
    }

    lines.forEach(function (rawLine) {
      var line = rawLine.trim();
      if (!line) return;

      var isBullet = BULLET_RE.test(line);
      var body = stripBullet(line);
      if (!body) return;

      /* 板块开头的总结句 → 板块导语（note）。必须带总结词，否则会把首个条目吃掉 */
      if (!items.length && !note && !isBullet && NOTE_HINT_RE.test(body) &&
        body.length >= 18 && !TIME_RE.test(body) && !SINGLE_TIME_RE.test(body)) {
        note = body;
        return;
      }

      if (isBullet) {
        if (!cur) pushItem('', '');
        cur.bullets.push(body);
        return;
      }

      if (looksLikeHeading(line, cur)) {
        var st = splitHeadingTime(line);
        pushItem(st.heading, st.meta);
        return;
      }

      if (!cur) {
        var st0 = splitHeadingTime(line);
        /* 首行若是一整句长文（无标题特征、无时间），当作要点而不是标题 */
        if (st0.heading.length > 34 && !st0.meta) {
          pushItem('', '');
          cur.bullets.push(body);
          return;
        }
        pushItem(st0.heading, st0.meta);
        return;
      }

      /* 条目已有标题但还没有要点，且本行像补充说明 → 放到条目的 sub 里 */
      if (!cur.bullets.length && !cur.sub && (body.length <= 40 || SUB_HINT_RE.test(body))) {
        cur.sub = body;
        return;
      }

      cur.bullets.push(body);
    });

    return {
      items: items.filter(function (it) { return it.heading || it.sub || it.bullets.length; }),
      note: note
    };
  }

  function parseKvSection(lines) {
    var pairs = [];
    lines.forEach(function (rawLine) {
      var line = stripBullet(rawLine.trim());
      if (!line) return;
      var m = /^(.{2,14}?)\s*[:：]\s*(.+)$/.exec(line);
      if (m) pairs.push({ key: m[1].trim(), value: m[2].trim() });
      else pairs.push({ key: '', value: line });
    });
    return pairs;
  }

  function parseListSection(lines) {
    return lines.map(function (l) { return stripBullet(l.trim()); }).filter(Boolean);
  }

  /* ---------- 主入口 ---------- */
  function resume(input) {
    var warnings = [];
    var lines = preprocess(input).filter(function (l) { return l !== ''; });

    if (!lines.length) {
      warnings.push('没有读到任何文本内容');
      return { data: RS.schema.blank(), report: { name: '', contacts: [], sections: [], warnings: warnings, lineCount: 0 } };
    }

    /* 1) 收割联系方式，得到"清洗后"的行 */
    var acc = { contacts: [] };
    var cleaned = lines.map(function (l) { return harvest(l, acc); });

    /* 2) 头部信息 */
    var name = detectName(cleaned);
    var headline = detectHeadline(cleaned, name);
    var positions = detectIntent(cleaned);
    var facts = detectFacts(cleaned);

    /* 3) 按板块标题切分 */
    var buckets = [];
    var current = null;
    cleaned.forEach(function (line, idx) {
      if (!line) return;
      var hit = matchSection(line);
      if (hit) {
        current = { meta: hit, lines: [] };
        buckets.push(current);
        return;
      }
      if (current) current.lines.push(line);
      else if (idx > 8) {
        /* 头部区域之后的散落内容，先攒着，最后归入"其他" */
        if (!buckets.length || buckets[0].meta.type !== '__head__') {
          /* 不新建 bucket，直接忽略以避免噪音 */
        }
      }
    });

    /* 4) 逐板块解析 */
    var sections = [];
    var report = [];
    buckets.forEach(function (b) {
      var body = b.lines.filter(function (l) { return l !== ''; });
      if (!body.length) return;
      var sec = {
        id: uid('sec'), type: b.meta.type, title: b.meta.title, visible: true, note: ''
      };
      var count = 0;
      if (b.meta.type === 'entry') {
        var parsed = parseEntrySection(body);
        var only = parsed.items[0];
        if (parsed.items.length === 1 && only && !only.heading && !only.meta && only.bullets.length) {
          /* 整块只有一个「无标题纯要点」条目 → 降级为纯列表，版式更自然 */
          sec.type = 'list';
          sec.bullets = only.bullets.slice();
          count = sec.bullets.length;
        } else {
          sec.items = parsed.items.length ? parsed.items : [RS.schema.blankItem()];
          count = parsed.items.length;
        }
        sec.note = parsed.note || '';
      } else if (b.meta.type === 'kv') {
        sec.pairs = parseKvSection(body);
        count = sec.pairs.length;
      } else if (b.meta.type === 'list') {
        sec.bullets = parseListSection(body);
        count = sec.bullets.length;
      } else {
        sec.body = body.join('\n');
        count = 1;
      }
      if (!count) return;
      sections.push(sec);
      report.push({ title: sec.title, type: sec.type, count: count });
    });

    /* 5) 组装 */
    var contacts = dedupe(acc.contacts);
    var data = RS.schema.normalize({
      schemaVersion: RS.schema.SCHEMA_VERSION,
      meta: {
        name: name,
        nameEn: '',
        photo: '',
        headline: headline,
        facts: facts,
        contacts: contacts.length ? contacts : [{ label: '电话', value: '' }, { label: '邮箱', value: '' }]
      },
      intent: { positions: positions, highlights: [] },
      summary: '',
      sections: sections.length ? sections : [RS.schema.blankSection('entry', '教育背景')],
      theme: { name: 'classic-blue', tokens: {} },
      versions: [{ name: '默认版本', overrides: {} }]
    });

    /* 6) 体检提示 */
    if (!name) warnings.push('没识别出姓名，请手动填写');
    if (!acc.contacts.length) warnings.push('没识别出联系方式，请手动填写');
    if (!sections.length) warnings.push('没识别出任何板块，可能简历结构比较特殊，建议手动整理');
    if (!positions.length) warnings.push('没识别出求职意向，请手动填写');

    return {
      data: data,
      report: {
        name: name,
        headline: headline,
        contacts: contacts,
        sections: report,
        warnings: warnings,
        lineCount: lines.length
      }
    };
  }

  RS.parseText = {
    resume: resume,
    matchSection: matchSection,
    splitHeadingTime: splitHeadingTime,
    parseEntrySection: parseEntrySection,
    cleanTitle: cleanTitle
  };
})();

</script>
<script>
/**
 * 简历工坊 Resume Studio · 文件产出
 * 职责：安全文件名、下载、生成「干净 HTML」（自包含、可直接分享）。
 * 同时暴露通用下载工具 RS.io.download。
 */
(function () {
  var RS = (typeof window !== 'undefined' ? (window.RS = window.RS || {}) : (globalThis.RS = globalThis.RS || {}));

  function safeFileName(name, ext) {
    var base = String(name === null || name === undefined ? '' : name)
      .replace(/[\\/:*?"<>|\r\n\t]+/g, '-')
      .replace(/\s+/g, '-')
      .replace(/-+/g, '-')
      .replace(/^-|-$/g, '');
    if (!base) base = 'resume';
    return base + (ext || '');
  }

  function download(filename, blob) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () {
      if (a.parentNode) a.parentNode.removeChild(a);
      URL.revokeObjectURL(url);
    }, 400);
  }

  function downloadText(filename, text, mime) {
    download(filename, new Blob([text], { type: (mime || 'text/plain') + ';charset=utf-8' }));
  }

  /** 把数据安全嵌进 HTML（防止 <\/script> 截断） */
  function embedData(data) {
    return JSON.stringify(data).replace(/</g, '\\u003c').replace(/\u2028|\u2029/g, '');
  }

  /** 生成自包含的干净 HTML（单文件，可分享、可打印） */
  function buildDocument(data) {
    var tokens = RS.tokens.resolve(data.theme);
    var vars = RS.tokens.toCssVars(tokens);
    var css = RS.documentCss || '';
    var inner = RS.renderHtml.render(data);
    var title = (data.meta && data.meta.name ? data.meta.name : '简历') + ' · 简历';

    return [
      '<!DOCTYPE html>',
      '<html lang="zh-CN">',
      '<head>',
      '<meta charset="UTF-8">',
      '<meta name="viewport" content="width=device-width, initial-scale=1">',
      '<title>' + RS.markup.escapeHtml(title) + '</title>',
      '<style>',
      vars,
      css,
      'html,body{margin:0;padding:0;background:#f3f4f6;}',
      'body{display:flex;justify-content:center;padding:20px 0;}',
      '.doc-page{box-shadow:0 1px 4px rgba(0,0,0,.12);}',
      '@media print{html,body{background:#fff;}body{display:block;padding:0;}.doc-page{box-shadow:none;margin:0 auto;}}',
      '</style>',
      '</head>',
      '<body>',
      inner,
      '<script type="application/json" id="rs-data">' + embedData(data) + '<\/script>',
      '</body>',
      '</html>'
    ].join('\n');
  }

  function exportHtml(data) {
    var html = buildDocument(data);
    var name = (data.meta && data.meta.name ? data.meta.name + '-简历' : 'resume');
    download(safeFileName(name, '.html'), new Blob([html], { type: 'text/html;charset=utf-8' }));
  }

  /** 备份 / 恢复（内部存档格式，不占对外主按钮） */
  function exportJson(data) {
    var name = (data.meta && data.meta.name ? data.meta.name + '-简历数据' : 'resume-data');
    downloadText(safeFileName(name, '.json'), JSON.stringify(data, null, 2), 'application/json');
  }

  RS.io = {
    safeFileName: safeFileName,
    download: download,
    downloadText: downloadText,
    buildDocument: buildDocument,
    exportHtml: exportHtml,
    exportJson: exportJson
  };
})();

</script>
<script>
/**
 * 简历工坊 Resume Studio · PDF 导出（浏览器打印通道）
 * 说明：本机无头浏览器渲染不可用（详见可行性评估 R1），因此 PDF 交由用户浏览器打印，
 *       所见即所得。界面外壳的隐藏由 app.css 的 @media print 规则完成。
 */
(function () {
  var RS = (typeof window !== 'undefined' ? (window.RS = window.RS || {}) : (globalThis.RS = globalThis.RS || {}));

  var restoring = false;
  var prevTitle = null;

  function restoreTitle() {
    if (restoring && prevTitle !== null) {
      document.title = prevTitle;
      prevTitle = null;
      restoring = false;
    }
  }

  /** 触发打印；Chrome/Edge 会以 document.title 作为默认 PDF 文件名 */
  function print(data) {
    var name = (data && data.meta && data.meta.name ? data.meta.name + '-简历' : '简历');
    if (!restoring) {
      prevTitle = document.title;
      restoring = true;
    }
    document.title = name;

    var onAfter = function () {
      window.removeEventListener('afterprint', onAfter);
      restoreTitle();
    };
    window.addEventListener('afterprint', onAfter);
    setTimeout(restoreTitle, 90000);

    setTimeout(function () { window.print(); }, 80);
  }

  RS.exportPdf = { print: print };
})();

</script>
<script>
/**
 * 简历工坊 Resume Studio · 板块操作（纯数据逻辑，不产生 DOM）
 * 渲染由 ui/form.js 负责，本文件只负责改动数据。
 */
(function () {
  var RS = (typeof window !== 'undefined' ? (window.RS = window.RS || {}) : (globalThis.RS = globalThis.RS || {}));

  function indexOfSection(data, id) {
    var list = data.sections || [];
    for (var i = 0; i < list.length; i++) { if (list[i].id === id) return i; }
    return -1;
  }

  function indexOfItem(data, secId, itemId) {
    var i = indexOfSection(data, secId);
    if (i < 0) return -1;
    var items = data.sections[i].items || [];
    for (var j = 0; j < items.length; j++) { if (items[j].id === itemId) return j; }
    return -1;
  }

  function addSection(type, title) {
    RS.store.mutate(function (d) { d.sections.push(RS.schema.blankSection(type, title)); });
  }

  function removeSection(id) {
    RS.store.mutate(function (d) {
      var i = indexOfSection(d, id);
      if (i >= 0) d.sections.splice(i, 1);
    });
  }

  function moveSection(id, dir) {
    RS.store.mutate(function (d) {
      var i = indexOfSection(d, id);
      var j = i + (dir === 'up' ? -1 : 1);
      if (i < 0 || j < 0 || j >= d.sections.length) return;
      var tmp = d.sections[i];
      d.sections[i] = d.sections[j];
      d.sections[j] = tmp;
    });
  }

  function toggleVisible(id) {
    RS.store.mutate(function (d) {
      var i = indexOfSection(d, id);
      if (i >= 0) d.sections[i].visible = d.sections[i].visible === false;
    });
  }

  /** 切换板块类型（保留标题，内容重置为该类型默认值） */
  function changeType(id, type) {
    RS.store.mutate(function (d) {
      var i = indexOfSection(d, id);
      if (i < 0) return;
      var old = d.sections[i];
      var next = RS.schema.blankSection(type, old.title);
      next.id = old.id;
      next.visible = old.visible;
      next.note = old.note;
      d.sections[i] = next;
    });
  }

  function addItem(secId) {
    RS.store.mutate(function (d) {
      var i = indexOfSection(d, secId);
      if (i < 0) return;
      var sec = d.sections[i];
      if (!sec.items) sec.items = [];
      sec.items.push(RS.schema.blankItem());
    });
  }

  function removeItem(secId, itemId) {
    RS.store.mutate(function (d) {
      var i = indexOfSection(d, secId);
      var j = indexOfItem(d, secId, itemId);
      if (i < 0 || j < 0) return;
      d.sections[i].items.splice(j, 1);
      if (!d.sections[i].items.length) d.sections[i].items.push(RS.schema.blankItem());
    });
  }

  function moveItem(secId, itemId, dir) {
    RS.store.mutate(function (d) {
      var i = indexOfSection(d, secId);
      var j = indexOfItem(d, secId, itemId);
      if (i < 0 || j < 0) return;
      var items = d.sections[i].items;
      var k = j + (dir === 'up' ? -1 : 1);
      if (k < 0 || k >= items.length) return;
      var tmp = items[j];
      items[j] = items[k];
      items[k] = tmp;
    });
  }

  function addPair(secId) {
    RS.store.mutate(function (d) {
      var i = indexOfSection(d, secId);
      if (i < 0) return;
      var sec = d.sections[i];
      if (!sec.pairs) sec.pairs = [];
      sec.pairs.push({ key: '', value: '' });
    });
  }

  function removePair(secId, pairIndex) {
    RS.store.mutate(function (d) {
      var i = indexOfSection(d, secId);
      if (i < 0) return;
      var pairs = d.sections[i].pairs || [];
      pairs.splice(pairIndex, 1);
      if (!pairs.length) pairs.push({ key: '', value: '' });
    });
  }

  RS.sections = {
    indexOfSection: indexOfSection,
    indexOfItem: indexOfItem,
    addSection: addSection,
    removeSection: removeSection,
    moveSection: moveSection,
    toggleVisible: toggleVisible,
    changeType: changeType,
    addItem: addItem,
    removeItem: removeItem,
    moveItem: moveItem,
    addPair: addPair,
    removePair: removePair
  };
})();

</script>
<script>
/**
 * 简历工坊 Resume Studio · 表单
 * 职责：渲染填写界面、绑定输入（路径写回数据）、折叠交互、照片压缩。
 * 关键约定：输入不重建 DOM（避免焦点丢失），只有结构性变更才整体重渲染。
 */
(function () {
  var RS = (typeof window !== 'undefined' ? (window.RS = window.RS || {}) : (globalThis.RS = globalThis.RS || {}));

  var root = null;
  var collapsed = {};          /* key -> true */
  var pendingScroll = null;

  function esc(s) { return RS.markup.escapeHtml(s === null || s === undefined ? '' : s); }
  function lines(v) {
    return String(v || '').split('\n').map(function (s) { return s.trim(); }).filter(function (s) { return s !== ''; });
  }

  /** 照片规格提示：尺寸、体积、以及是否偏大 */
  function photoHint(m) {
    var out = ['<span class="rs-hint">自动裁成 3:4 并压缩为 JPEG</span>'];
    var photo = String((m && m.photo) || '');
    if (photo.indexOf('data:') === 0) {
      var kb = Math.round(photo.length * 0.75 / 1024);
      out.push('<span class="rs-hint' + (kb > 300 ? ' rs-hint-warn' : '') + '">当前 420 × 560 px · 约 ' +
        kb + ' KB' + (kb > 300 ? '（偏大）' : '') + '</span>');
    } else if (photo) {
      out.push('<span class="rs-hint">当前使用外部图片链接</span>');
    }
    return out.join('');
  }

  /* ---------- 原子控件 ---------- */
  function field(label, path, value, ph, extra) {
    return '<label class="rs-field' + (extra ? ' ' + extra : '') + '">' +
      '<span class="rs-label">' + esc(label) + '</span>' +
      '<input class="rs-input" type="text" data-path="' + esc(path) + '" value="' + esc(value) + '"' +
      (ph ? ' placeholder="' + esc(ph) + '"' : '') + '>' +
      '</label>';
  }

  function areaLines(label, path, value, ph, rows) {
    var v = Array.isArray(value) ? value.join('\n') : (value || '');
    return '<label class="rs-field">' +
      '<span class="rs-label">' + esc(label) + '</span>' +
      '<textarea class="rs-area" rows="' + (rows || 3) + '" data-array="' + esc(path) + '"' +
      (ph ? ' placeholder="' + esc(ph) + '"' : '') + '>' + esc(v) + '</textarea>' +
      '</label>';
  }

  function areaText(label, path, value, ph, rows) {
    return '<label class="rs-field">' +
      '<span class="rs-label">' + esc(label) + '</span>' +
      '<textarea class="rs-area" rows="' + (rows || 3) + '" data-path="' + esc(path) + '"' +
      (ph ? ' placeholder="' + esc(ph) + '"' : '') + '>' + esc(value || '') + '</textarea>' +
      '</label>';
  }

  function card(key, title, hint, body) {
    var isCollapsed = collapsed[key] ? ' is-collapsed' : '';
    return '<section class="rs-card' + isCollapsed + '" data-card="' + esc(key) + '">' +
      '<header class="rs-card-head">' +
      '<button type="button" class="rs-collapse" data-act="collapse" data-key="' + esc(key) + '" aria-label="折叠">▾</button>' +
      '<span class="rs-card-title">' + esc(title) + '</span>' +
      '<span class="rs-card-hint">' + esc(hint || '') + '</span>' +
      '</header>' +
      '<div class="rs-card-body">' + body + '</div>' +
      '</section>';
  }

  /* ---------- 基本信息 ---------- */
  function cardMeta(d) {
    var m = d.meta || {};
    var b = [];
    b.push('<div class="rs-grid2">');
    b.push(field('姓名', 'meta.name', m.name, '张三'));
    b.push(field('姓名拼音（可选）', 'meta.nameEn', m.nameEn, 'Zhang San'));
    b.push('</div>');
    b.push(field('一句话定位', 'meta.headline', m.headline, '2027 届本科应届生 · 某某大学 社会学'));
    b.push(areaLines('基本信息标签（一行一条）', 'meta.facts', m.facts, '20 岁\n男\n汉族', 3));

    b.push('<div class="rs-subhead">联系方式</div>');
    (m.contacts || []).forEach(function (c, i) {
      b.push('<div class="rs-row">' +
        '<input class="rs-input rs-w-90" type="text" data-path="meta.contacts.' + i + '.label" value="' + esc(c.label) + '" placeholder="标签">' +
        '<input class="rs-input" type="text" data-path="meta.contacts.' + i + '.value" value="' + esc(c.value) + '" placeholder="内容">' +
        '<button type="button" class="rs-icon" data-act="remove-contact" data-index="' + i + '" title="删除">×</button>' +
        '</div>');
    });
    b.push('<button type="button" class="rs-btn rs-btn-sm" data-act="add-contact">＋ 添加联系方式</button>');

    b.push('<div class="rs-subhead">证件照</div>');
    b.push('<div class="rs-row rs-row-photo">' +
      '<div class="rs-photo-box' + (m.photo ? ' has-photo' : '') + '" data-act="pick-photo" ' +
      'title="点击选择 / 直接拖入图片 / Ctrl+V 粘贴">' +
      (m.photo ? '<img src="' + esc(m.photo) + '" alt="">' : '<span>点击 · 拖入 · 粘贴</span>') +
      '</div>' +
      '<div class="rs-photo-actions">' +
      '<div class="rs-row">' +
      '<label class="rs-btn rs-btn-sm">选择图片<input type="file" accept="image/*" data-act="photo" hidden></label>' +
      (m.photo ? '<button type="button" class="rs-btn rs-btn-sm" data-act="remove-photo">移除</button>' : '') +
      '</div>' +
      photoHint(m) +
      '</div></div>');

    return card('meta', '基本信息', m.name ? '已填写' : '待填写', b.join(''));
  }

  /* ---------- 求职意向 ---------- */
  function cardIntent(d) {
    var it = d.intent || {};
    var b = [];
    b.push(areaLines('岗位方向（一行一条，界面上以「、」连接）', 'intent.positions', it.positions,
      '市场/用户研究\n社会调研与项目执行\n研究/运营助理', 3));
    b.push(areaLines('标签行（一行一条，**文字** 表示加粗）', 'intent.highlights', it.highlights,
      '社会学\n国家级企业调查 · 个人触达 **130+** 家', 3));
    var n = (it.positions || []).length;
    return card('intent', '求职意向', n ? n + ' 个方向' : '待填写', b.join(''));
  }

  /* ---------- 个人简介 ---------- */
  function cardSummary(d) {
    var b = areaText('简介正文（3–4 行最佳）', 'summary', d.summary,
      '社会学本科。参与 1 项国家级企业调查与 3 次区域田野调研……', 4);
    return card('summary', '个人简介', d.summary ? '已填写' : '可选', b);
  }

  /* ---------- 板块 ---------- */
  function itemBlock(sec, i, it, j) {
    var base = 'sections.' + i + '.items.' + j + '.';
    var b = [];
    b.push('<div class="rs-item">');
    b.push('<div class="rs-item-bar">' +
      '<span class="rs-item-no">' + (j + 1) + '</span>' +
      '<span class="rs-spacer"></span>' +
      '<button type="button" class="rs-icon" data-act="move-item-up" data-sec="' + esc(sec.id) + '" data-item="' + esc(it.id) + '" title="上移">↑</button>' +
      '<button type="button" class="rs-icon" data-act="move-item-down" data-sec="' + esc(sec.id) + '" data-item="' + esc(it.id) + '" title="下移">↓</button>' +
      '<button type="button" class="rs-icon" data-act="remove-item" data-sec="' + esc(sec.id) + '" data-item="' + esc(it.id) + '" title="删除">×</button>' +
      '</div>');
    b.push(field('条目名称', base + 'heading', it.heading, '某某大学 · 社会学（本科）'));
    b.push('<div class="rs-grid2">');
    b.push(field('时间', base + 'meta', it.meta, '2023.09 – 2027.06'));
    b.push(field('补充说明（可选）', base + 'sub', it.sub, '主修：社会研究方法、社会统计学'));
    b.push('</div>');
    b.push(areaLines('要点（一行一条，**文字** 表示加粗）', base + 'bullets', it.bullets,
      '独立触达 **130+** 家企业，面向中高层开展陌生拜访', 4));
    b.push('</div>');
    return b.join('');
  }

  function cardSection(d, sec, i) {
    var key = sec.id;
    var b = [];
    b.push(field('板块标题', 'sections.' + i + '.title', sec.title, '教育背景'));
    b.push(field('板块导语（可选，灰色小字）', 'sections.' + i + '.note', sec.note, '三次调研累计产出约 **3 万字**'));

    if (sec.type === 'entry') {
      (sec.items || []).forEach(function (it, j) { b.push(itemBlock(sec, i, it, j)); });
      b.push('<button type="button" class="rs-btn rs-btn-sm" data-act="add-item" data-sec="' + esc(sec.id) + '">＋ 添加条目</button>');
    } else if (sec.type === 'kv') {
      (sec.pairs || []).forEach(function (p, j) {
        b.push('<div class="rs-row">' +
          '<input class="rs-input rs-w-140" type="text" data-path="sections.' + i + '.pairs.' + j + '.key" value="' + esc(p.key) + '" placeholder="分类（如 研究方法）">' +
          '<input class="rs-input" type="text" data-path="sections.' + i + '.pairs.' + j + '.value" value="' + esc(p.value) + '" placeholder="内容">' +
          '<button type="button" class="rs-icon" data-act="remove-pair" data-sec="' + esc(sec.id) + '" data-index="' + j + '" title="删除">×</button>' +
          '</div>');
      });
      b.push('<button type="button" class="rs-btn rs-btn-sm" data-act="add-pair" data-sec="' + esc(sec.id) + '">＋ 添加一行</button>');
    } else if (sec.type === 'list') {
      b.push(areaLines('条目（一行一条）', 'sections.' + i + '.bullets', sec.bullets, '证明材料一\n证明材料二', 4));
    } else if (sec.type === 'text') {
      b.push(areaText('正文', 'sections.' + i + '.body', sec.body, '自我评价……', 4));
    }

    var hint = (sec.visible === false ? '已隐藏' : '显示中');
    var isCollapsed = collapsed[key] ? ' is-collapsed' : '';
    return '<section class="rs-card rs-sec' + isCollapsed + '" data-card="' + esc(key) + '" data-sec-id="' + esc(sec.id) + '">' +
      '<header class="rs-card-head">' +
      '<button type="button" class="rs-collapse" data-act="collapse" data-key="' + esc(key) + '" aria-label="折叠">▾</button>' +
      '<input class="rs-input rs-sec-title" type="text" data-path="sections.' + i + '.title" value="' + esc(sec.title) + '" aria-label="板块标题">' +
      '<span class="rs-card-hint">' + esc(hint) + '</span>' +
      '<select class="rs-select rs-select-sm" data-act="change-type" data-sec="' + esc(sec.id) + '" title="板块类型">' +
      RS.schema.SECTION_TYPES.map(function (t) {
        return '<option value="' + t + '"' + (t === sec.type ? ' selected' : '') + '>' + esc(t) + '</option>';
      }).join('') +
      '</select>' +
      '<label class="rs-switch" title="是否在简历中显示">' +
      '<input type="checkbox" data-act="toggle-visible" data-sec="' + esc(sec.id) + '"' + (sec.visible === false ? '' : ' checked') + '>' +
      '<span>显示</span></label>' +
      '<button type="button" class="rs-icon" data-act="move-sec-up" data-sec="' + esc(sec.id) + '" title="上移">↑</button>' +
      '<button type="button" class="rs-icon" data-act="move-sec-down" data-sec="' + esc(sec.id) + '" title="下移">↓</button>' +
      '<button type="button" class="rs-icon rs-danger" data-act="remove-sec" data-sec="' + esc(sec.id) + '" title="删除">×</button>' +
      '</header>' +
      '<div class="rs-card-body">' + b.join('') + '</div>' +
      '</section>';
  }

  function addSectionBar() {
    return '<div class="rs-addsec">' +
      '<select class="rs-select" id="rsAddPreset">' +
      RS.schema.SECTION_PRESETS.map(function (p, i) {
        return '<option value="' + i + '">' + esc(p.label) + '</option>';
      }).join('') +
      '</select>' +
      '<button type="button" class="rs-btn" data-act="add-section">＋ 添加板块</button>' +
      '</div>';
  }

  /* ---------- 总渲染 ---------- */
  function buildHtml(d) {
    var out = [];
    out.push(cardMeta(d));
    out.push(cardIntent(d));
    out.push(cardSummary(d));
    var visibleCount = (d.sections || []).filter(function (s) { return s.visible !== false; }).length;
    out.push('<div class="rs-block-title">内容板块 <span class="rs-count">' + visibleCount + ' / ' + (d.sections || []).length + ' 个显示中</span></div>');
    (d.sections || []).forEach(function (sec, i) { out.push(cardSection(d, sec, i)); });
    out.push(addSectionBar());
    return out.join('');
  }

  function render(data) {
    if (!root) return;
    var scroller = root.parentElement;
    var top = scroller ? scroller.scrollTop : 0;
    root.innerHTML = buildHtml(data);
    if (scroller) scroller.scrollTop = top;
  }

  /* ---------- 事件 ---------- */
  function onInput(e) {
    var el = e.target;
    if (!el || !el.dataset) return;
    if (el.dataset.path) {
      RS.store.set(el.dataset.path, el.value);
    } else if (el.dataset.array) {
      RS.store.set(el.dataset.array, lines(el.value));
    }
  }

  function onChange(e) {
    var el = e.target;
    if (!el || !el.dataset) return;
    var act = el.dataset.act;
    if (act === 'toggle-visible') {
      RS.sections.toggleVisible(el.dataset.sec);
    } else if (act === 'change-type') {
      RS.sections.changeType(el.dataset.sec, el.value);
    } else if (act === 'photo') {
      handlePhoto(el.files && el.files[0]);
    }
  }

  function onClick(e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el || !el.dataset) return;
    var act = el.dataset.act;
    if (act === 'collapse') {
      var key = el.dataset.key;
      collapsed[key] = !collapsed[key];
      var cardEl = root.querySelector('[data-card="' + key + '"]');
      if (cardEl) cardEl.classList.toggle('is-collapsed', !!collapsed[key]);
      return;
    }
    if (act === 'pick-photo') {
      var fileInput = root.querySelector('input[data-act="photo"]');
      if (fileInput) fileInput.click();
      return;
    }
    var sec = el.dataset.sec;
    switch (act) {
      case 'add-section': {
        var sel = root.querySelector('#rsAddPreset');
        var preset = RS.schema.SECTION_PRESETS[Number(sel && sel.value) || 0];
        RS.sections.addSection(preset.type, preset.title);
        break;
      }
      case 'remove-sec': RS.sections.removeSection(sec); break;
      case 'move-sec-up': RS.sections.moveSection(sec, 'up'); break;
      case 'move-sec-down': RS.sections.moveSection(sec, 'down'); break;
      case 'add-item': RS.sections.addItem(sec); break;
      case 'remove-item': RS.sections.removeItem(sec, el.dataset.item); break;
      case 'move-item-up': RS.sections.moveItem(sec, el.dataset.item, 'up'); break;
      case 'move-item-down': RS.sections.moveItem(sec, el.dataset.item, 'down'); break;
      case 'add-pair': RS.sections.addPair(sec); break;
      case 'remove-pair': RS.sections.removePair(sec, Number(el.dataset.index)); break;
      case 'add-contact': RS.store.mutate(function (d) { d.meta.contacts.push({ label: '', value: '' }); }); break;
      case 'remove-contact': RS.store.mutate(function (d) { d.meta.contacts.splice(Number(el.dataset.index), 1); }); break;
      case 'remove-photo': RS.store.set('meta.photo', ''); break;
      default: break;
    }
  }

  /* ---------- 拖拽与粘贴 ---------- */
  function notify(msg, kind) {
    if (RS.toolbar && RS.toolbar.toast) RS.toolbar.toast(msg, kind);
  }

  function photoBoxEl() { return root ? root.querySelector('[data-act="pick-photo"]') : null; }

  function setDropActive(on) {
    var box = photoBoxEl();
    if (box) box.classList.toggle('is-drop', !!on);
  }

  function onDragOver(e) {
    var dt = e.dataTransfer;
    if (!dt) return;
    var types = dt.types ? Array.prototype.slice.call(dt.types) : [];
    if (types.indexOf('Files') < 0) return;
    /* 阻止浏览器直接打开拖入的文件 */
    e.preventDefault();
    try { dt.dropEffect = 'copy'; } catch (err) { /* 部分浏览器只读 */ }
    setDropActive(true);
  }

  function onDragLeave(e) {
    if (!root || !e.relatedTarget || !root.contains(e.relatedTarget)) setDropActive(false);
  }

  function onDrop(e) {
    var dt = e.dataTransfer;
    if (!dt || !dt.files || !dt.files.length) return;
    e.preventDefault();
    setDropActive(false);
    var f = dt.files[0];
    if (/^image\//.test(f.type)) {
      handlePhoto(f);
    } else {
      notify('这里只接收图片。导入旧简历请用「更多 → 导入旧简历」', 'bad');
    }
  }

  function onPaste(e) {
    var items = (e.clipboardData && e.clipboardData.items) || [];
    for (var i = 0; i < items.length; i++) {
      if (String(items[i].type || '').indexOf('image') === 0) {
        var f = items[i].getAsFile();
        if (f) {
          e.preventDefault();
          handlePhoto(f);
          return;
        }
      }
    }
  }

  /* ---------- 照片压缩 ---------- */
  function handlePhoto(file) {
    if (!file) return;
    if (!/^image\//.test(file.type)) { notify('请选择图片文件', 'bad'); return; }
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var TW = 420, TH = 560;
        var canvas = document.createElement('canvas');
        canvas.width = TW;
        canvas.height = TH;
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, TW, TH);
        /* 等比裁剪填充（证件照比例） */
        var scale = Math.max(TW / img.width, TH / img.height);
        var w = img.width * scale, h = img.height * scale;
        ctx.drawImage(img, (TW - w) / 2, (TH - h) / 2, w, h);
        var dataUrl = canvas.toDataURL('image/jpeg', 0.84);
        RS.store.set('meta.photo', dataUrl);
        var kb = Math.round(dataUrl.length * 0.75 / 1024);
        notify('证件照已插入 · 420×560 · 约 ' + kb + ' KB');
      };
      img.onerror = function () { notify('图片读取失败，换一张试试', 'bad'); };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  function init(el) {
    root = el;
    el.addEventListener('input', onInput);
    el.addEventListener('change', onChange);
    el.addEventListener('click', onClick);
    el.addEventListener('dragover', onDragOver);
    el.addEventListener('dragleave', onDragLeave);
    el.addEventListener('drop', onDrop);
    document.addEventListener('paste', onPaste);
  }

  RS.form = { init: init, render: render };
})();

</script>
<script>
/**
 * 简历工坊 Resume Studio · 预览
 * 职责：渲染 A4 文档、自适应缩放、页数测量与溢出预警（简历的第一硬伤）。
 */
(function () {
  var RS = (typeof window !== 'undefined' ? (window.RS = window.RS || {}) : (globalThis.RS = globalThis.RS || {}));

  var stage = null, frame = null, scaler = null, pageInfo = null, warnBox = null;
  var currentData = null;
  var lastMetrics = { pages: 1, height: 0, ratio: 1, heaviest: null };

  function el(id) { return document.getElementById(id); }

  function themeStyle() {
    var s = el('rs-theme-style');
    if (!s) {
      s = document.createElement('style');
      s.id = 'rs-theme-style';
      document.head.appendChild(s);
    }
    return s;
  }

  function render(data) {
    currentData = data;
    if (!scaler) return;
    var tokens = RS.tokens.resolve(data.theme);
    themeStyle().textContent = RS.tokens.toCssVars(tokens);
    scaler.innerHTML = RS.renderHtml.render(data);
    fit();
    measure();
    requestAnimationFrame(measure);
    setTimeout(measure, 220);
  }

  /** 自适应缩放：按预览区可用宽度等比缩放整页 */
  function fit() {
    if (!stage || !scaler) return;
    var page = scaler.querySelector('.doc-page');
    if (!page) return;
    var tokens = RS.tokens.resolve((currentData && currentData.theme) || {});
    var pageW = tokens.pageW;
    var avail = stage.clientWidth - 32;
    var scale = Math.min(1, Math.max(0.35, avail / pageW));
    var h = page.offsetHeight;
    scaler.style.transform = 'scale(' + scale + ')';
    scaler.style.left = Math.max(0, (stage.clientWidth - pageW * scale) / 2) + 'px';
    frame.style.height = Math.round(h * scale + 32) + 'px';
    scaler.dataset.scale = String(scale);
  }

  /** 页数测量 + 溢出预警 */
  function measure() {
    if (!scaler || !pageInfo) return;
    var page = scaler.querySelector('.doc-page');
    if (!page) return;
    var tokens = RS.tokens.resolve((currentData && currentData.theme) || {});
    var pageH = tokens.pageH;
    var h = page.offsetHeight;
    /* 8px 容差，避免亚像素误差误报 */
    var pages = Math.max(1, Math.ceil((h - 8) / pageH));
    var ratio = h / pageH;

    /* 找最占地方的板块，供精简建议 */
    var heaviest = null;
    var secs = page.querySelectorAll('.doc-section');
    for (var i = 0; i < secs.length; i++) {
      var hh = secs[i].offsetHeight;
      if (!heaviest || hh > heaviest.h) {
        heaviest = { h: hh, title: secs[i].getAttribute('data-sec-title') || '该板块' };
      }
    }

    lastMetrics = { pages: pages, height: h, ratio: ratio, heaviest: heaviest };

    pageInfo.textContent = '当前 ' + pages + ' 页 · 正文 ' + tokens.fsBody + 'px · A4 单面' +
      (pages > 1 ? ' · 实占 ' + ratio.toFixed(2) + ' 页' : '');

    var msg = '', cls = 'rs-ok';
    if (pages > 1) {
      cls = 'rs-bad';
      msg = '内容超出 1 页（约 ' + ratio.toFixed(2) + ' 页），建议精简「' +
        (heaviest ? heaviest.title : '内容最多的板块') + '」';
    } else if (ratio > 0.96) {
      cls = 'rs-warn';
      msg = '已接近一页底部，再加内容就会溢出';
    } else {
      msg = '版面正常，单页内';
    }
    warnBox.className = 'rs-warnbox ' + cls;
    warnBox.textContent = msg;
  }

  function init() {
    stage = el('rsStage');
    frame = el('rsFrame');
    scaler = el('rsScaler');
    pageInfo = el('rsPageInfo');
    warnBox = el('rsWarn');
    if (typeof ResizeObserver !== 'undefined' && stage) {
      var ro = new ResizeObserver(function () { fit(); });
      ro.observe(stage);
    } else {
      window.addEventListener('resize', function () { fit(); });
    }
  }

  RS.preview = {
    init: init,
    render: render,
    fit: fit,
    metrics: function () { return lastMetrics; }
  };
})();

</script>
<script>
/**
 * 简历工坊 Resume Studio · 顶栏
 * 职责：版本切换与管理、主题自定义、成稿检查入口、导出菜单、存档状态、通用弹窗。
 */
(function () {
  var RS = (typeof window !== 'undefined' ? (window.RS = window.RS || {}) : (globalThis.RS = globalThis.RS || {}));

  var els = {};
  var currentData = null;

  function $(id) { return document.getElementById(id); }
  function esc(s) { return RS.markup.escapeHtml(s === null || s === undefined ? '' : s); }

  /* ---------- 下拉菜单 ---------- */
  function closeMenus(except) {
    document.querySelectorAll('.rs-menu').forEach(function (m) {
      if (m !== except) m.hidden = true;
    });
  }

  function toggleMenu(menu, fill) {
    if (!menu) return;
    var willOpen = menu.hidden;
    closeMenus(menu);
    if (willOpen) {
      if (fill) fill(menu);
      menu.hidden = false;
    } else {
      menu.hidden = true;
    }
  }

  /* ---------- 弹窗 ---------- */
  function openModal(title, bodyHtml) {
    els.modalTitle.textContent = title;
    els.modalBody.innerHTML = bodyHtml;
    els.modal.hidden = false;
  }
  function closeModal() { els.modal.hidden = true; }

  function toast(msg, kind) {
    var t = document.createElement('div');
    t.className = 'rs-toast ' + (kind ? 'rs-toast-' + kind : '');
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { t.classList.add('is-in'); }, 10);
    setTimeout(function () {
      t.classList.remove('is-in');
      setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 260);
    }, 2600);
  }

  /* ---------- 版本 ---------- */
  function fillVersionMenu(menu) {
    var versions = RS.store.versions();
    var idx = RS.store.versionIndex();
    var html = versions.map(function (v, i) {
      return '<button type="button" data-ver="' + i + '"' + (i === idx ? ' class="is-active"' : '') + '>' +
        esc(v.name) + (i === idx ? '<span class="rs-menu-note">当前</span>' : '') + '</button>';
    }).join('');
    html += '<div class="rs-menu-sep"></div>';
    html += '<button type="button" data-ver-act="new">＋ 新建版本（复制当前）</button>';
    html += '<button type="button" data-ver-act="manage">管理版本与差量…</button>';
    menu.innerHTML = html;
  }

  function openVersionManager() {
    var versions = RS.store.versions();
    var idx = RS.store.versionIndex();
    var b = [];
    b.push('<p class="rs-modal-tip">版本之间共享同一份主数据，只记录「差量字段」。在下方列出的是本版本的覆盖项。</p>');
    versions.forEach(function (v, i) {
      var names = Object.keys(v.overrides || {});
      b.push('<div class="rs-vrow' + (i === idx ? ' is-current' : '') + '">' +
        '<input class="rs-input" type="text" data-ver-name="' + i + '" value="' + esc(v.name) + '">' +
        (i === idx ? '<span class="rs-badge">当前</span>' : '<button class="rs-btn rs-btn-sm" data-ver-switch="' + i + '">切换</button>') +
        '<button class="rs-icon rs-danger" data-ver-del="' + i + '"' + (versions.length <= 1 ? ' disabled' : '') + ' title="删除">×</button>' +
        '</div>');
      if (names.length) {
        b.push('<ul class="rs-ovlist">' + names.map(function (n) {
          return '<li><code>' + esc(n) + '</code><button class="rs-icon rs-danger" data-ver-clear="' + i + '|' + esc(n) + '" title="移除该差量">×</button></li>';
        }).join('') + '</ul>');
      }
    });
    b.push('<div class="rs-modal-actions"><button class="rs-btn" data-ver-act="new2">＋ 新建版本</button></div>');
    openModal('版本与差量', b.join(''));
  }

  /* ---------- 主题 ---------- */
  function openThemePanel() {
    var t = RS.tokens.resolve(currentData.theme);
    var fonts = [
      { v: '"Microsoft YaHei","PingFang SC","Hiragino Sans GB","Source Han Sans CN",sans-serif', l: '微软雅黑 / 苹方（默认）' },
      { v: '"Source Han Serif CN","Songti SC","SimSun",serif', l: '思源宋体 / 宋体（正式）' },
      { v: '"Source Han Sans CN","PingFang SC","Microsoft YaHei",sans-serif', l: '思源黑体（现代）' },
      { v: 'system-ui,-apple-system,"Segoe UI",sans-serif', l: '系统默认无衬线' }
    ];
    var b = [];
    b.push('<div class="rs-tfield"><label>主题主色</label>' +
      '<input type="color" id="rsAccent" value="' + esc(t.accent) + '">' +
      '<span class="rs-hint">影响标题、强调与分隔线</span></div>');
    b.push('<div class="rs-tfield"><label>整体字号</label>' +
      '<input type="range" id="rsScale" min="0.88" max="1.14" step="0.01" value="' + esc(t.fontScale) + '">' +
      '<span class="rs-hint" id="rsScaleVal">' + Math.round(t.fontScale * 100) + '%</span></div>');
    b.push('<div class="rs-tfield"><label>正文字体</label>' +
      '<select class="rs-select" id="rsFont">' +
      fonts.map(function (f) { return '<option value="' + esc(f.v) + '"' + (f.v === t.fontFamily ? ' selected' : '') + '>' + esc(f.l) + '</option>'; }).join('') +
      '</select></div>');
    b.push('<div class="rs-tfield"><label>证件照尺寸</label>' +
      '<select class="rs-select" id="rsPhotoSize">' +
      RS.tokens.PHOTO_PRESETS.map(function (p) {
        var cur = Number(t.photoW) === p.w && Number(t.photoH) === p.h;
        return '<option value="' + p.w + 'x' + p.h + '"' + (cur ? ' selected' : '') + '>' + esc(p.label) + '</option>';
      }).join('') +
      '</select></div>');
    b.push('<div class="rs-modal-actions">' +
      '<button class="rs-btn" id="rsThemeReset">恢复默认</button>' +
      '<button class="rs-btn" id="rsThemeExport">导出主题</button>' +
      '<button class="rs-btn" id="rsThemeImport">导入主题</button>' +
      '</div>');
    openModal('主题自定义', b.join(''));
  }

  /* ---------- 检查 ---------- */
  function openCheckPanel() {
    if (!RS.lint) { toast('检查模块未加载', 'bad'); return; }
    var issues = RS.lint.run(currentData, RS.preview.metrics());
    var b = [];
    if (!issues.length) {
      b.push('<p class="rs-modal-tip">未发现明显问题。发布前建议再人工读一遍。</p>');
    } else {
      var order = { red: 0, yellow: 1, gray: 2 };
      issues.sort(function (a, c) { return order[a.level] - order[c.level]; });
      b.push('<ul class="rs-issuelist">' + issues.map(function (it) {
        return '<li class="rs-issue rs-issue-' + it.level + '">' +
          '<span class="rs-issue-code">' + esc(it.code) + '</span>' +
          '<span class="rs-issue-text">' + esc(it.message) + '</span></li>';
      }).join('') + '</ul>');
    }
    b.push('<p class="rs-modal-tip">规则可在 <code>src/core/lint.js</code> 中调整开关与阈值。</p>');
    openModal('成稿检查', b.join(''));
  }

  /* ---------- 导出 ---------- */
  function doExport(kind) {
    var data = currentData;
    if (kind === 'pdf') {
      RS.exportPdf.print(data);
    } else if (kind === 'html') {
      RS.io.exportHtml(data);
      toast('已导出网页文件');
    } else if (kind === 'json') {
      RS.io.exportJson(data);
      toast('已导出数据备份');
    } else if (kind === 'docx') {
      if (!RS.renderDocx) { toast('Word 模块未加载', 'bad'); return; }
      toast('正在生成 Word 文档…');
      RS.renderDocx.export(data).then(function () {
        toast('已导出 Word 文档');
      }).catch(function (e) {
        console.error(e);
        toast('Word 导出失败：' + e.message, 'bad');
      });
    }
  }

  /* ---------- 更多 ---------- */
  function doMore(kind) {
    if (kind === 'import-resume') {
      if (RS.importer) RS.importer.open();
      else toast('导入模块未加载', 'bad');
    } else if (kind === 'demo') {
      if (confirm('载入示例数据将覆盖当前内容，继续？')) { RS.store.loadDemo(); toast('已载入示例数据'); }
    } else if (kind === 'blank') {
      if (confirm('新建空白简历将覆盖当前内容，继续？')) { RS.store.resetEmpty(); toast('已新建空白简历'); }
    } else if (kind === 'import') {
      els.fileInput.click();
    } else if (kind === 'clear') {
      if (confirm('将清除本机浏览器中保存的所有简历数据，且不可恢复。建议先导出备份。继续？')) {
        RS.store.clearStorage();
        RS.store.resetEmpty();
        toast('本机数据已清除');
      }
    } else if (kind === 'shortcut') {
      openModal('快捷键与小贴士', [
        '<ul class="rs-tiplist">',
        '<li><b>**文字**</b> 表示加粗，写要点时用它强调数字与结果</li>',
        '<li>要点、标签、技能都支持<b>一行一条</b>，从旧简历整段粘贴最快</li>',
        '<li>证件照支持<b>点击选择 / 直接拖入 / Ctrl+V 粘贴</b>三种方式</li>',
        '<li>旧简历可用「更多 → 从旧简历导入」自动填表（支持 .docx 与粘贴文本）</li>',
        '<li>导出 PDF 时在打印窗口把「边距」选为<b>无</b>、勾选<b>背景图形</b></li>',
        '<li>打印目标选「另存为 PDF」，文件名会自动带上姓名</li>',
        '<li>所有数据只存在你自己电脑的浏览器里，不上传任何服务器</li>',
        '</ul>'
      ].join(''));
    }
  }

  function importJson(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var data = RS.schema.normalize(JSON.parse(reader.result));
        RS.store.replaceData(data);
        toast('已导入：' + (data.meta.name || '未命名'));
      } catch (e) {
        toast('导入失败：不是有效的数据文件', 'bad');
      }
    };
    reader.readAsText(file, 'utf-8');
  }

  /* ---------- 同步 ---------- */
  function sync(data, reason) {
    currentData = data;
    if (!els.versionLabel) return;
    var versions = RS.store.versions();
    var v = versions[RS.store.versionIndex()];
    els.versionLabel.textContent = (v ? v.name : '默认版本');
    if (reason === 'saved' || reason === 'change' || reason === 'structure' || reason === 'version' || reason === 'replace') {
      els.savedNote.textContent = RS.store.storageOK() ? '已自动保存至本机' : '本机存储不可用，请及时导出备份';
      els.savedNote.classList.toggle('rs-danger-text', !RS.store.storageOK());
    }
  }

  /* ---------- 初始化 ---------- */
  function init() {
    els.versionLabel = $('rsVersionLabel');
    els.versionMenu = $('rsVersionMenu');
    els.exportMenu = $('rsExportMenu');
    els.moreMenu = $('rsMoreMenu');
    els.savedNote = $('rsSavedNote');
    els.modal = $('rsModal');
    els.modalTitle = $('rsModalTitle');
    els.modalBody = $('rsModalBody');
    els.fileInput = $('rsFileInput');

    document.getElementById('rsVersionBtn').addEventListener('click', function (e) {
      e.stopPropagation();
      toggleMenu(els.versionMenu, fillVersionMenu);
    });
    document.getElementById('rsExportBtn').addEventListener('click', function (e) {
      e.stopPropagation();
      toggleMenu(els.exportMenu);
    });
    document.getElementById('rsMoreBtn').addEventListener('click', function (e) {
      e.stopPropagation();
      toggleMenu(els.moreMenu);
    });
    document.getElementById('rsThemeBtn').addEventListener('click', function (e) {
      e.stopPropagation(); closeMenus(); openThemePanel();
    });
    document.getElementById('rsCheckBtn').addEventListener('click', function (e) {
      e.stopPropagation(); closeMenus(); openCheckPanel();
    });
    document.getElementById('rsModalClose').addEventListener('click', closeModal);

    document.addEventListener('click', function (e) {
      if (!e.target.closest('.rs-dd')) closeMenus();
      if (e.target === els.modal) closeModal();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { closeMenus(); closeModal(); }
    });

    /* 菜单与弹窗内的委托 */
    els.versionMenu.addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.ver !== undefined) { RS.store.setVersion(Number(b.dataset.ver)); closeMenus(); }
      else if (b.dataset.verAct === 'new') { RS.store.addVersion(); closeMenus(); toast('已新建版本'); }
      else if (b.dataset.verAct === 'manage') { closeMenus(); openVersionManager(); }
    });

    els.exportMenu.addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b || !b.dataset.export) return;
      closeMenus();
      doExport(b.dataset.export);
    });

    els.moreMenu.addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b || !b.dataset.more) return;
      closeMenus();
      doMore(b.dataset.more);
    });

    els.modalBody.addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.verSwitch !== undefined) { RS.store.setVersion(Number(b.dataset.verSwitch)); openVersionManager(); }
      else if (b.dataset.verDel !== undefined) {
        if (confirm('删除该版本？差量设置将一并丢失。')) { RS.store.removeVersion(Number(b.dataset.verDel)); openVersionManager(); }
      } else if (b.dataset.verClear) {
        var parts = b.dataset.verClear.split('|');
        var vi = Number(parts[0]);
        var vname = parts.slice(1).join('|');
        if (vi === RS.store.versionIndex()) { RS.store.setOverride(vname, ''); }
        else { toast('请先切换到该版本再移除差量'); }
        openVersionManager();
      } else if (b.dataset.verAct === 'new' || b.dataset.verAct === 'new2') {
        RS.store.addVersion(); openVersionManager();
      } else if (b.id === 'rsThemeReset') {
        RS.store.mutate(function (d) { d.theme.tokens = {}; });
        openThemePanel(); toast('已恢复默认主题');
      } else if (b.id === 'rsThemeExport') {
        RS.io.downloadText('resume-studio-theme.json',
          JSON.stringify({ name: 'custom', tokens: RS.store.raw().theme.tokens || {} }, null, 2), 'application/json');
        toast('已导出主题');
      } else if (b.id === 'rsThemeImport') {
        els.themeFileInput.click();
      }
    });

    els.modalBody.addEventListener('input', function (e) {
      var el = e.target;
      if (el.id === 'rsAccent') RS.store.mutate(function (d) { d.theme.tokens.accent = el.value; });
      else if (el.id === 'rsScale') {
        RS.store.mutate(function (d) { d.theme.tokens.fontScale = Number(el.value); });
        var sv = document.getElementById('rsScaleVal');
        if (sv) sv.textContent = Math.round(Number(el.value) * 100) + '%';
      } else if (el.dataset && el.dataset.verName !== undefined) {
        RS.store.renameVersion(Number(el.dataset.verName), el.value);
      }
    });
    els.modalBody.addEventListener('change', function (e) {
      var el = e.target;
      if (el.id === 'rsFont') RS.store.mutate(function (d) { d.theme.tokens.fontFamily = el.value; });
      else if (el.id === 'rsPhotoSize') {
        var wh = String(el.value).split('x');
        RS.store.mutate(function (d) {
          d.theme.tokens.photoW = Number(wh[0]);
          d.theme.tokens.photoH = Number(wh[1]);
        });
      }
    });

    els.fileInput.addEventListener('change', function () { importJson(els.fileInput.files[0]); els.fileInput.value = ''; });
    els.themeFileInput = $('rsThemeFileInput');
    els.themeFileInput.addEventListener('change', function () {
      var f = els.themeFileInput.files[0];
      if (!f) return;
      var r = new FileReader();
      r.onload = function () {
        try {
          var obj = JSON.parse(r.result);
          RS.store.mutate(function (d) { d.theme.tokens = obj.tokens || obj || {}; });
          openThemePanel();
          toast('已导入主题');
        } catch (err) { toast('主题文件无效', 'bad'); }
      };
      r.readAsText(f, 'utf-8');
      els.themeFileInput.value = '';
    });
  }

  RS.toolbar = { init: init, sync: sync, toast: toast, openModal: openModal, closeModal: closeModal };
})();

</script>
<script>
/**
 * 简历工坊 Resume Studio · 旧简历导入
 * 支持：.docx（本地解析）、.txt/.md、直接粘贴文本（覆盖 PDF / 网页 / 微信来源）。
 * 全程本地完成，文件不上传。
 */
(function () {
  var RS = (typeof window !== 'undefined' ? (window.RS = window.RS || {}) : (globalThis.RS = globalThis.RS || {}));

  var pending = null;

  function esc(s) { return RS.markup.escapeHtml(s === null || s === undefined ? '' : s); }
  function id(x) { return document.getElementById(x); }

  /* ---------- 弹窗骨架 ---------- */
  function panelHtml() {
    return [
      '<p class="rs-modal-tip">在这里导入你的旧简历，自动填进编辑器。' +
      '支持 <b>.docx</b> 文件，或直接粘贴文本（从 PDF、网页、微信里复制都行）。' +
      '<b>解析全部在本机完成，文件不会上传。</b></p>',

      '<div class="rs-drop" id="rsDropZone">',
      '<div class="rs-drop-main">把 .docx 拖到这里</div>',
      '<div class="rs-drop-sub">或 <button type="button" class="rs-btn rs-btn-sm" id="rsPickFile">选择文件</button></div>',
      '</div>',
      '<input type="file" id="rsImportFile" accept=".docx,.txt,.md,.markdown,text/plain" hidden>',

      '<div class="rs-subhead">或者，粘贴简历文本</div>',
      '<textarea class="rs-area" id="rsPasteText" rows="5" ' +
      'placeholder="在 PDF / Word / 网页里 Ctrl+A 全选、Ctrl+C 复制，粘贴到这里，然后点「解析文本」"></textarea>',
      '<div class="rs-modal-actions">',
      '<button type="button" class="rs-btn rs-btn-primary" id="rsParseBtn">解析文本</button>',
      '<span class="rs-hint" id="rsParseHint">PDF 直接拖进来无效，请复制文本粘贴</span>',
      '</div>',

      '<div id="rsParseResult"></div>'
    ].join('');
  }

  /* ---------- 结果区 ---------- */
  function setStatus(msg, isErr) {
    var box = id('rsParseResult');
    if (box) box.innerHTML = '<div class="rs-parsestatus' + (isErr ? ' is-err' : '') + '">' + esc(msg) + '</div>';
    pending = null;
  }

  function renderResult(res) {
    pending = res;
    var r = res.report;
    var b = [];

    b.push('<div class="rs-result">');
    b.push('<div class="rs-subhead">识别结果</div>');
    b.push('<div class="rs-kvline"><span>姓名</span><b>' + esc(r.name || '未识别') + '</b></div>');
    if (r.headline) b.push('<div class="rs-kvline"><span>一句话</span><b>' + esc(r.headline) + '</b></div>');
    b.push('<div class="rs-kvline"><span>联系方式</span><b>' +
      (r.contacts.length ? esc(r.contacts.map(function (c) { return c.label + '=' + c.value; }).join('　')) : '未识别') +
      '</b></div>');
    b.push('<div class="rs-kvline"><span>文本行数</span><b>' + r.lineCount + '</b></div>');

    if (r.sections.length) {
      b.push('<div class="rs-subhead">识别到的板块（' + r.sections.length + ' 个）</div>');
      b.push('<ul class="rs-seclist">' + r.sections.map(function (s) {
        return '<li><span class="rs-secname">' + esc(s.title) + '</span>' +
          '<span class="rs-sectype">' + esc(s.type) + '</span>' +
          '<span class="rs-seccount">' + s.count + (s.type === 'text' ? ' 字' : ' 项') + '</span></li>';
      }).join('') + '</ul>');
    }

    if (r.warnings.length) {
      b.push('<div class="rs-warnbox-list">' + r.warnings.map(function (w) {
        return '<div class="rs-warnline">' + esc(w) + '</div>';
      }).join('') + '</div>');
    }

    b.push('<p class="rs-modal-tip">解析是启发式的，结构复杂的简历可能需要手动微调 —— ' +
      '但比对着空白表单从零填快得多。</p>');
    b.push('<div class="rs-modal-actions">' +
      '<button type="button" class="rs-btn rs-btn-primary" id="rsApplyBtn">应用到编辑器</button>' +
      '<button type="button" class="rs-btn" id="rsCancelBtn">取消</button>' +
      '</div>');
    b.push('</div>');

    id('rsParseResult').innerHTML = b.join('');
  }

  /* ---------- 文件处理 ---------- */
  function handleFile(f) {
    if (!f) return;
    var name = String(f.name || '').toLowerCase();

    if (/\.docx$/.test(name)) {
      setStatus('正在读取 ' + f.name + ' …');
      var reader = new FileReader();
      reader.onload = function () {
        RS.parseDocx.parse(reader.result).then(function (r) {
          if (!r.lines.filter(function (l) { return l.trim(); }).length) {
            setStatus('这个文档里没有读到文字（可能是纯图片排版），建议手动填写', true);
            return;
          }
          renderResult(RS.parseText.resume(r.lines));
        }).catch(function (e) {
          setStatus('解析失败：' + e.message, true);
        });
      };
      reader.onerror = function () { setStatus('文件读取失败，换一个文件试试', true); };
      reader.readAsArrayBuffer(f);
      return;
    }

    if (/\.(txt|md|markdown)$/.test(name) || String(f.type || '').indexOf('text/') === 0) {
      var tr = new FileReader();
      tr.onload = function () { renderResult(RS.parseText.resume(tr.result)); };
      tr.onerror = function () { setStatus('文件读取失败', true); };
      tr.readAsText(f, 'utf-8');
      return;
    }

    if (/\.doc$/.test(name)) {
      setStatus('旧版 .doc 无法直接解析：请用 Word 另存为 .docx，或全选复制文本粘贴到下面', true);
      return;
    }
    if (/\.pdf$/.test(name)) {
      setStatus('PDF 不直接解析（中文 PDF 编码复杂，容易出错）：请打开 PDF 全选复制，粘贴到下面 —— 这样反而更准', true);
      return;
    }
    setStatus('不认识这种文件，请用 .docx 或直接粘贴文本', true);
  }

  /* ---------- 应用 ---------- */
  function apply() {
    if (!pending) return;
    if (!confirm('将用导入结果替换当前编辑器里的内容（你已上传的证件照会保留）。继续？')) return;
    var next = RS.schema.deepClone(pending.data);
    var oldPhoto = RS.store.raw().meta && RS.store.raw().meta.photo;
    if (!next.meta.photo && oldPhoto) next.meta.photo = oldPhoto;
    RS.store.replaceData(next);
    RS.toolbar.closeModal();
    RS.toolbar.toast('已导入，请核对姓名、联系方式与板块归属');
  }

  /* ---------- 打开与绑定 ---------- */
  function bind() {
    var zone = id('rsDropZone');
    var file = id('rsImportFile');

    zone.addEventListener('click', function () { file.click(); });
    zone.addEventListener('dragover', function (e) {
      e.preventDefault();
      zone.classList.add('is-over');
    });
    zone.addEventListener('dragleave', function () { zone.classList.remove('is-over'); });
    zone.addEventListener('drop', function (e) {
      e.preventDefault();
      zone.classList.remove('is-over');
      var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) handleFile(f);
    });
    file.addEventListener('change', function () {
      if (file.files && file.files[0]) handleFile(file.files[0]);
      file.value = '';
    });

    id('rsParseBtn').addEventListener('click', function () {
      var text = id('rsPasteText').value;
      if (!String(text).trim()) { RS.toolbar.toast('先粘贴一些文本再解析', 'bad'); return; }
      renderResult(RS.parseText.resume(text));
    });

    id('rsParseResult').addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('button') : null;
      if (!b) return;
      if (b.id === 'rsApplyBtn') apply();
      else if (b.id === 'rsCancelBtn') RS.toolbar.closeModal();
    });
  }

  function open() {
    pending = null;
    RS.toolbar.openModal('从旧简历导入', panelHtml());
    bind();
  }

  RS.importer = { open: open };
})();

</script>
<script>
/**
 * 简历工坊 Resume Studio · 启动
 */
(function () {
  var RS = (typeof window !== 'undefined' ? (window.RS = window.RS || {}) : (globalThis.RS = globalThis.RS || {}));

  function injectDocCss() {
    if (document.getElementById('rs-doc-style')) return;
    var s = document.createElement('style');
    s.id = 'rs-doc-style';
    s.textContent = RS.documentCss || '';
    document.head.appendChild(s);
  }

  function boot() {
    injectDocCss();
    RS.store.init();

    RS.form.init(document.getElementById('rsForm'));
    RS.preview.init();
    RS.toolbar.init();

    RS.store.subscribe(function (data, reason) {
      if (reason === 'structure' || reason === 'replace' || reason === 'version') {
        RS.form.render(data);
      }
      RS.preview.render(data);
      RS.toolbar.sync(data, reason);
    });

    var d = RS.store.current();
    RS.form.render(d);
    RS.preview.render(d);
    RS.toolbar.sync(d, 'init');

    if (!RS.store.storageOK()) {
      RS.toolbar.toast('本机存储不可用，请用「更多 → 备份数据」保存进度', 'bad');
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();

</script>

</body>
